/* Settings → District Logo: store the chosen image (as a data URL) and redraw */
function uploadDistrictLogo(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) { showToast('Choose an image (PNG or SVG)'); return; }
  var r = new FileReader();
  r.onload = function(ev) {
    try { localStorage.setItem('sctv_district_logo', ev.target.result); refreshDistrictLogo(); }
    catch (e) { showToast('That image is too large to store: try a smaller PNG or an SVG'); return; }
    renderSettingsPage(); showToast('District logo saved');
  };
  r.readAsDataURL(f);
}

/* Demo data: the default Display Lists get realistic carbs, fat and protein (lists you make carry their own) */
function withDemoNutrients(lists) {
  (lists || []).forEach(function(l) { (l.items || []).forEach(function(it) {
    if (it.carbs == null) it.carbs = Math.round((it.cal || 0) * 0.12); if (it.fat == null) it.fat = Math.round((it.cal || 0) * 0.03); if (it.protein == null) it.protein = Math.round((it.cal || 0) * 0.05); }); });
  return lists;
}

      +'<div style="display:flex;gap:6px;margin-top:8px">'
      +'<span style="font-size:9px;padding:2px 8px;border-radius:8px;background:'+(item.isDefault?'#05966920':'var(--mid)')+';color:'+(item.isDefault?'#059669':'var(--muted)')+';font-weight:600">'+(item.isDefault?'Default':'Published')+'</span>'

function wirePubEvents() {
  document.querySelectorAll('.pub-new-template').forEach(function(btn) { btn.addEventListener('click', function() { openPublishFromDistrict(); }); });   /* 31b */
  /* Theme actions */
  document.querySelectorAll('.pub-new-theme').forEach(function(btn) {
    btn.addEventListener('click', function() { openPubThemeEditor(); });
  });
  document.querySelectorAll('.pub-edit-theme').forEach(function(btn) {
    btn.addEventListener('click', function(e) { e.stopPropagation(); openPubThemeEditor(btn.getAttribute('data-tid')); });
  });
  document.querySelectorAll('.pub-del-theme').forEach(function(btn) {
    btn.addEventListener('click', function(e) { e.stopPropagation(); deleteTheme(btn.getAttribute('data-tid')); renderPublishingPage(); });
  });

  /* Background actions */
  document.querySelector('.pub-new-bg')?.addEventListener('click', openAddBackgroundModal);
  document.querySelectorAll('.pub-del-bg').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var bgs = JSON.parse(localStorage.getItem('sctv_pub_backgrounds') || '[]');
      var idx = parseInt(btn.getAttribute('data-idx'));
      var removed = bgs.splice(idx, 1)[0];
      localStorage.setItem('sctv_pub_backgrounds', JSON.stringify(bgs));
      renderPublishingPage();
      showUndoToast('Background removed', function() {
        var current = JSON.parse(localStorage.getItem('sctv_pub_backgrounds') || '[]');
        current.splice(idx, 0, removed);
        localStorage.setItem('sctv_pub_backgrounds', JSON.stringify(current));
        renderPublishingPage();
      });
    });
  });

  /* Template thumbnails */
  requestAnimationFrame(function() {
    (SHARED_BOARDS||[]).filter(function(b){return b.tier==='cybersoft';}).forEach(function(b) {
      if(b.elements) renderBoardThumbnail(b, 'pub_thumb_'+b.id);
    });
    (SHARED_DECKS||[]).filter(function(dk){return dk.tier==='cybersoft';}).forEach(function(dk) {
      if(dk.slides && dk.slides.length) {
        var firstSlide = dk.slides[0];
        var board = (SHARED_BOARDS||[]).find(function(b){return b.id===firstSlide.boardId;}) || loadBoardData(firstSlide.boardId);
        if(board) renderBoardThumbnail(board, 'pub_thumb_'+dk.id);
      }
    });
  });
}

/* ── Publishing Theme Editor (full version) ── */
function openPubThemeEditor(themeId) {
  var themes = getThemes();
  var theme;
  if(themeId === '__restore__' && window._editingTheme) {
    theme = window._editingTheme;
    window._editingTheme = null;
  } else {
    theme = themeId ? themes.find(function(t){return t.id===themeId;}) : null;
  }
  var isNew = !theme || !themes.find(function(t){return t.id===theme.id;});
  if(isNew) {
    theme = {id:'th-'+Date.now().toString(36), name:'New Theme', tier:'cybersoft', publishedBy:'Cybersoft',
      palette:{primary:'#5249D2',accent:'#F59E0B',text:'#FFFFFF',muted:'#AAAAAA',bg:'#1E1B3A'},
      fonts:{display:'Sora',body:'Sora'},
      elementDefaults:{headlineColor:'#5249D2',footerBg:'#1D4ED8',shapeFill:'#F59E0B'},
      headerImage:''};
  }

  var modal = document.createElement('div');
  modal.id = 'pubThemeModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:5000;display:flex;align-items:center;justify-content:center';
  modal.onclick = function(e){ if(e.target===modal) modal.remove(); };

  var p = theme.palette;
  var ed = theme.elementDefaults;

  var colorRow = function(label, val, path) {
    return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0">'
      +'<label style="width:24px;height:24px;border-radius:5px;background:'+val+';border:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;flex-shrink:0">'
      +'<input type="color" value="'+val+'" class="pub-theme-color" data-path="'+path+'" style="position:absolute;inset:-4px;width:32px;height:32px;opacity:0;cursor:pointer">'
      +'</label>'
      +'<div style="flex:1;font-size:12px;color:var(--text)">'+label+'</div>'
      +'<div style="font-size:10px;color:var(--muted);font-family:monospace">'+val+'</div></div>';
  };

  var content = '<div style="width:600px;max-height:calc(85 * var(--vh, 1vh));background:var(--panel);border-radius:12px;overflow:hidden;display:flex;flex-direction:column" onclick="event.stopPropagation()">'
    +'<div style="padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700;color:var(--text)">'+(isNew?'Create Theme':'Edit Theme')+'</div>'
    +'<div style="padding:16px 20px;overflow-y:auto;flex:1">'

    /* Name */
    +'<div style="margin-bottom:14px"><label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px">Theme Name</label>'
    +'<input id="ptName" class="ctrl-input" style="width:100%;font-size:13px;padding:8px 12px" value="'+escHtml(theme.name)+'"></div>'

    /* Header Image */
    +'<div style="margin-bottom:14px"><label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px">Header / Preview Image</label>'
    +'<div style="font-size:10px;color:var(--muted);margin-bottom:6px">Shown in the theme picker to set the mood</div>'
    +'<div id="ptHeaderPreview" style="margin-bottom:6px;border-radius:6px;overflow:hidden;height:120px;background:var(--mid)">'
    +(theme.headerImage ? '<img src="'+theme.headerImage+'" style="width:100%;height:100%;object-fit:cover">' : '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px">No image selected</div>')
    +'</div>'
    +'<div style="display:flex;gap:6px">'
    +'<label class="cl-hdr-btn" style="font-size:10px;padding:4px 12px;cursor:pointer">Upload<input type="file" accept="image/*" id="ptHeaderFile" style="display:none"></label>'
    +'<button class="cl-hdr-btn" id="ptHeaderLibrary" style="font-size:10px;padding:4px 12px">Browse Library</button>'
    +'<button class="cl-hdr-btn" id="ptHeaderRemove" style="font-size:10px;padding:4px 12px;color:#e05">Remove</button>'
    +'</div></div>'

    /* Palette */
    +'<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Palette</div>'
    +colorRow('Primary', p.primary, 'palette.primary')
    +colorRow('Accent', p.accent, 'palette.accent')
    +colorRow('Text', p.text, 'palette.text')
    +colorRow('Muted', p.muted, 'palette.muted')
    +colorRow('Background', p.bg, 'palette.bg')
    +'</div>'

    /* Element Defaults */
    +'<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Element Defaults</div>'
    +colorRow('Headline Color', ed.headlineColor, 'elementDefaults.headlineColor')
    +colorRow('Footer Background', ed.footerBg, 'elementDefaults.footerBg')
    +colorRow('Shape Fill', ed.shapeFill, 'elementDefaults.shapeFill')
    +'</div>'

    /* Fonts */
    +'<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Typography</div>'
    +'<div style="display:flex;gap:10px">'
    +'<div style="flex:1"><label style="font-size:10px;color:var(--muted);display:block;margin-bottom:3px">Display Font</label>'
    +'<select id="ptFontDisplay" class="ctrl-input" style="width:100%;font-size:12px;padding:6px 10px" onchange="document.getElementById(&quot;ptFontPreview&quot;).style.fontFamily=this.value">'+CURATED_FONTS.map(function(f){return '<option value="'+f+'"'+(f===theme.fonts.display?' selected':'')+' style="font-family:'+f+'">'+f+'</option>';}).join('')+'</select></div>'
    +'<div style="flex:1"><label style="font-size:10px;color:var(--muted);display:block;margin-bottom:3px">Body Font</label>'
    +'<select id="ptFontBody" class="ctrl-input" style="width:100%;font-size:12px;padding:6px 10px" onchange="document.getElementById(&quot;ptBodyPreview&quot;).style.fontFamily=this.value">'+CURATED_FONTS.map(function(f){return '<option value="'+f+'"'+(f===theme.fonts.body?' selected':'')+' style="font-family:'+f+'">'+f+'</option>';}).join('')+'</select></div>'
    +'</div>'
    +'<div style="margin-top:8px;padding:10px;background:var(--mid);border-radius:6px">'
    +'<div id="ptFontPreview" style="font-family:'+theme.fonts.display+';font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px">LUNCH MENU</div>'
    +'<div id="ptBodyPreview" style="font-family:'+theme.fonts.body+';font-size:13px;color:var(--muted)">Golden Grilled Cheese · Street-Style Beef Tacos · Garden Fresh Wrap</div>'
    +'</div></div>'

    +'</div>'
    +'<div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end">'
    +'<button class="cl-hdr-btn" id="ptCancel" style="font-size:12px;padding:6px 16px">Cancel</button>'
    +'<button class="cl-hdr-btn primary" id="ptSave" style="font-size:12px;padding:6px 16px">'+(isNew?'Publish Theme':'Save')+'</button>'
    +'</div></div>';

  modal.innerHTML = content;
  document.body.appendChild(modal);

  /* Wire header image upload */
  document.getElementById('ptHeaderLibrary').addEventListener('click', function() {
    window._themeHeaderCallback = function(url) { theme.headerImage = url; var prev = document.getElementById("ptHeaderPreview"); if(prev) prev.innerHTML = '<img src="'+url+'" style="width:100%;height:100%;object-fit:cover">'; };
    openClPicker('__theme_header__');
  });
  document.getElementById('ptHeaderFile').addEventListener('change', function(e) {
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) { theme.headerImage = ev.target.result; var prev = document.getElementById("ptHeaderPreview"); if(prev) prev.innerHTML = '<img src="'+ev.target.result+'" style="width:100%;height:100%;object-fit:cover">'; };
    reader.readAsDataURL(file);
  });

  var removeBtn = document.getElementById('ptHeaderRemove');
  if(removeBtn) removeBtn.addEventListener('click', function() { theme.headerImage = ""; var prev = document.getElementById("ptHeaderPreview"); if(prev) prev.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px">No image selected</div>'; });

  /* Wire cancel/save */
  document.getElementById('ptCancel').addEventListener('click', function() { modal.remove(); });
  document.getElementById('ptSave').addEventListener('click', function() {
    theme.name = document.getElementById('ptName').value.trim() || theme.name;
    theme.fonts.display = document.getElementById('ptFontDisplay').value.trim() || 'Sora';
    theme.fonts.body = document.getElementById('ptFontBody').value.trim() || 'Sora';
    modal.querySelectorAll('.pub-theme-color').forEach(function(inp) {
      var path = inp.getAttribute('data-path').split('.');
      if(path.length===2) theme[path[0]][path[1]] = inp.value;
    });
    var allThemes = getThemes();
    var idx = allThemes.findIndex(function(t){return t.id===theme.id;});
    if(idx >= 0) { allThemes[idx] = theme; } else { allThemes.push(theme); }
    saveThemes(allThemes);
    modal.remove();
    renderPublishingPage();
    showToast(isNew ? 'Theme published' : 'Theme updated');
  });
}

function demoLineCategoriesUpdated(lines) {

var weatherCache = {}; /* { lat_lon: { temp, code, unit, fetchedAt } } */

var WMO_ICON = {
  0:'☀️', 1:'🌤️', 2:'⛅', 3:'🌥️',
  45:'🌫️', 48:'🌫️',
  51:'🌦️', 53:'🌦️', 55:'🌧️',
  61:'🌧️', 63:'🌧️', 65:'🌧️',
  71:'🌨️', 73:'❄️', 75:'❄️',
  80:'🌧️', 81:'🌧️', 82:'⛈️',
  95:'⛈️', 96:'⛈️', 99:'⛈️',
};
var WMO_DESC = {
  0:'Clear', 1:'Mostly Clear', 2:'Partly Cloudy', 3:'Overcast',
  45:'Foggy', 48:'Foggy', 51:'Light Drizzle', 53:'Drizzle', 55:'Heavy Drizzle',
  61:'Light Rain', 63:'Rain', 65:'Heavy Rain',
  71:'Light Snow', 73:'Snow', 75:'Heavy Snow',
  80:'Showers', 81:'Showers', 82:'Heavy Showers',
  95:'Thunderstorm', 96:'Thunderstorm', 99:'Thunderstorm',
};

function fetchWeather(el) {
  var key = el.lat + '_' + el.lon + '_' + (el.unit||'F');
  var cache = weatherCache[key];
  if(cache && Date.now() - cache.fetchedAt < 30*60*1000) return; /* 30 min cache */
  var unit = (el.unit||'F')==='C' ? 'celsius' : 'fahrenheit';
  var url  = 'https://api.open-meteo.com/v1/forecast?latitude='+el.lat+'&longitude='+el.lon
           + '&current=temperature_2m,weather_code&temperature_unit='+unit+'&timezone=auto';
  fetch(url).then(function(r){ return r.json(); }).then(function(data){
    if(data && data.current) {
      weatherCache[key] = {
        temp: Math.round(data.current.temperature_2m),
        code: data.current.weather_code,
        unit: (el.unit||'F'),
        fetchedAt: Date.now(),
      };
      renderBoard();
    }
  }).catch(function(){});
}

function getWeatherDisplay(el) {
  var key   = el.lat + '_' + el.lon + '_' + (el.unit||'F');
  var cache = weatherCache[key];
  var icon  = cache ? (WMO_ICON[cache.code]  || '🌡️') : '🌡️';
  var desc  = cache ? (WMO_DESC[cache.code]  || '')    : '';
  var temp  = cache ? cache.temp + '°' + (el.unit||'F') : '—°' + (el.unit||'F');   /* the unit shows before the reading arrives */
  return { icon:icon, desc:desc, temp:temp, loaded:!!cache };
}

/* ── LIVE TIME UPDATER ── */
var _timeTick = null;
function startTimeTick() {
  if(_timeTick) return;
  _timeTick = setInterval(function() {
    if (typeof stripTimeText === 'function') document.querySelectorAll('[data-strip-time]').forEach(function(n) { var t = stripTimeText(); if (n.textContent !== t) n.textContent = t; });   /* Info strips (48) */
    var tEls = document.querySelectorAll('[data-time-live]');
    tEls.forEach(function(node) {
      var eid = node.dataset.timeLive;
      var el  = elements.find(function(x){ return x.id===eid; });
      if(!el) return;
      node.innerHTML = buildTimeHTML(el);
    });
  }, 1000);
}

function buildTimeHTML(el) {
  var now   = new Date();
  var hr    = now.getHours();
  var mn    = now.getMinutes().toString().padStart(2,'0');
  var sc    = now.getSeconds().toString().padStart(2,'0');
  var ampm  = '';
  if(el.format !== '24hr') {
    ampm = hr >= 12 ? ' PM' : ' AM';
    hr   = (hr % 12) || 12;
  } else {
    hr = hr.toString().padStart(2,'0');
  }
  var tStr  = hr + ':' + mn + (el.showSeconds ? ':' + sc : '') + ampm;
  var sz    = el.size || 80;
  var col   = el.color || '#ffffff';
  var ff    = "font-family:'" + (el._df||'Sora') + "',sans-serif";
  var html  = '<div style="'+ff+';font-size:'+sz+'px;'+textFaceCSS(el, '700')+'color:'+col+';line-height:1;white-space:nowrap">'+tStr+'</div>';   /* Bold / Italic / Underline */
  if(el.showDate) {
    var dStr = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    html += '<div style="'+ff+';font-size:'+Math.round(sz*0.32)+'px;color:'+col+';opacity:.7;margin-top:4px">'+dStr+'</div>';
  }
  return html;
}

/* ── Custom item tags (districts define them in Settings → Item tags) ───────────────────────────────────────────
   Each tag: a name, an icon (an emoji or an uploaded image) and a color. "New" is built in (it is the item's NEW flag
   and can't be deleted); Spicy and Recommended come as starters. Menu Items has Diet Lifestyles (vegetarian, vegan, …)
   and Tags; items carry itemTags (manual records, or overlays on imported items, like options). Boards show a badge per
   tag beside the item name, wherever NEW shows (Show tags, on by default); TVs get the definitions in their player file.
   Items marked "spicy" under the old Dietary list keep showing the Spicy tag. */
var ITEM_TAGS_KEY = 'sctv_item_tags';
var DEFAULT_ITEM_TAGS = [{ id: 'new', name: 'New', icon: '', color: '#E11D48', system: true }, { id: 'spicy', name: 'Spicy', icon: '\ud83c\udf36\ufe0f', color: '#DC2626' }, { id: 'recommended', name: 'Recommended', icon: '\u2b50', color: '#D97706' }];
/* No storage reads while drawing: the host supplies the tags (a TV's player file), or the designer keeps them in memory,
   loaded once here and updated on every save (like the district logo) */
