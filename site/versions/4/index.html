function getMenuItem(period, itemId) {
  if(!period || !itemId) return null;
  return (MENU_DATA[period] || []).find(function(x){ return x.id === itemId; }) || null;

/* ---- Global Menu Planning connection ---- */
var globalMenu = {
  active: false,
  period: 'current',   /* follows the current meal (multi-meal spec) */
  mode: 'auto',     // auto | rotation | manual
  itemId: null,
  rotation: {},
};

function resolveGlobalItem() {
  if(!globalMenu.active) return null;
  var gp = globalMenu.period === 'current' ? currentMealType() : globalMenu.period;
  var items;
  if(globalMenu.activeListId) {
    items = getActiveLunchItems();
  } else {
    items = (gp==='Lunch' ? getActiveLunchItems() : gp==='Breakfast' ? getActiveBreakfastItems() : MENU_DATA[gp]) || [];
  }
  if(!items.length) return null;
  var day = new Date().getDay();
  if(globalMenu.mode === 'manual') return getMenuItem(gp, globalMenu.itemId) || items[0];
  if(globalMenu.mode === 'rotation' && globalMenu.rotation) {
    var rid = globalMenu.rotation[day];
    return (rid ? getMenuItem(gp, rid) : null) || items[day % items.length];
  }
  return items[day % items.length]; // auto = day-of-week rotation
}

function setGlobalMenu(key, val) {
  globalMenu[key] = val;
  if(key==='period') {
    globalMenu.itemId = null;
    var items = MENU_DATA[val === 'current' ? currentMealType() : val] || [];
    var rot = {};
    DAY_NAMES.forEach(function(n,i){ rot[i] = items[i%items.length] ? items[i%items.length].id : null; });
    globalMenu.rotation = rot;
  }
  renderBoard();
  // Refresh controls if a callout is selected
  if(selectedId && elements.find(function(x){return x.id===selectedId&&x.type==='callout';})) buildElementControls(selectedId);
  buildGlobalMenuUI();
}

function setGlobalMenuRotDay(dayIdx, itemId) {
  if(!globalMenu.rotation) globalMenu.rotation = {};
  globalMenu.rotation[dayIdx] = itemId;
  renderBoard();
  buildGlobalMenuUI();
}

function setGlobalMenuItemId(itemId) {
  globalMenu.itemId = itemId;
  renderBoard();
  buildGlobalMenuUI();
}

function toggleGlobalMenu(on) {
  globalMenu.active = !!on;
  if(on && Object.keys(globalMenu.rotation).length === 0) {
    var items = MENU_DATA[globalMenu.period === 'current' ? currentMealType() : globalMenu.period] || [];
    var rot = {};
    DAY_NAMES.forEach(function(n,i){ rot[i] = items[i%items.length] ? items[i%items.length].id : null; });
    globalMenu.rotation = rot;
  }
  renderBoard();
  if(selectedId) buildElementControls(selectedId);
  buildGlobalMenuUI();
}

/* ---- Auto-update data binding ---- */
var DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function resolveItemFromBinding(el) {
  var db = el.dataBinding;
  if(!db || !db.active) return null;
  var items = MENU_DATA[db.period] || [];
  if(!items.length) return null;
  if(db.mode === 'manual') return getMenuItem(db.period, db.itemId);
  // Auto mode: pick by rule
  var day = new Date().getDay(); // 0=Sun
  if(db.mode === 'rotation' && db.rotation) {
    var rid = db.rotation[day];
    return (rid ? getMenuItem(db.period, rid) : null) || items[day % items.length];
  }
  // 'auto' / highest-count: simulate with day-of-week index
  return items[day % items.length];
}
function resolveText(el) {
  var db = el.dataBinding;
  if(!db || !db.active) return el.text || '';
  var item = resolveItemFromBinding(el);
  if(!item) return el.text || '';
  return db.field==='desc' ? item.desc : db.field==='name' ? item.name : item.mktName;
}
function resolveEmoji(el) {
  var db = el.dataBinding;
  if(!db || !db.active) return el.emoji || '?';
  var item = resolveItemFromBinding(el);
  return item ? item.emoji : (el.emoji || '?');
}
function activateBinding(id, mode) {
  var el = elements.find(function(x){ return x.id===id; });
  if(!el) return;
  mode = mode || 'auto';
  var rot = {};
  var items = MENU_DATA['Lunch'] || [];
  DAY_NAMES.forEach(function(n,i){ rot[i] = items[i % items.length] ? items[i % items.length].id : null; });
  el.dataBinding = { active:true, period:'Lunch', mode:mode, field:'mktName',
                     itemId:null, rotation: rot };
  renderBoard(); buildElementControls(id);
}
function deactivateBinding(id) {
  var el = elements.find(function(x){ return x.id===id; });
  if(!el) return;
  el.dataBinding = { active:false };
  renderBoard(); buildElementControls(id);
}
function setBinding(id, key, val) {
  var el = elements.find(function(x){ return x.id===id; });
  if(!el || !el.dataBinding) return;
  el.dataBinding[key] = val;
  if(key==='period') {
    var items = MENU_DATA[val] || [];
    var rot = {};
    DAY_NAMES.forEach(function(n,i){ rot[i] = items[i%items.length] ? items[i%items.length].id : null; });
    el.dataBinding.rotation = rot;
    el.dataBinding.itemId = null;
  }
  renderBoard(); buildElementControls(id);
}
function setBindingItem(id, itemId) {
  var el = elements.find(function(x){ return x.id===id; });
  if(!el || !el.dataBinding) return;
  el.dataBinding.itemId = itemId;
  renderBoard(); buildElementControls(id);
}
function setRotationDay(id, dayIdx, itemId) {
  var el = elements.find(function(x){ return x.id===id; });
  if(!el || !el.dataBinding) return;
  if(!el.dataBinding.rotation) el.dataBinding.rotation = {};
  el.dataBinding.rotation[dayIdx] = itemId;
  renderBoard(); buildElementControls(id);
}

        + 'style="padding:6px 8px;border-radius:5px;border:1.5px solid ' + (isSel?'var(--brand)':'var(--border)') + ';'

      + '<div style="font-size:9px;color:var(--muted)">Updates at midnight without any action</div></div>'
      + '</div>'
    : '';

  return '<div style="background:rgba(82,73,210,.04);border-top:1px solid rgba(82,73,210,.18)">'
    + '<div style="padding:10px 14px 0;display:flex;align-items:center;justify-content:space-between">'

    + liveBadge
    + '</div>';
}

function seededRand(seed) {
  let s = seed;
  return () => { s = (s*1664525+1013904223)&0xFFFFFFFF; return (s>>>0)/0xFFFFFFFF; };
}
function leafSVG(w, h, color, op) {
  return `<svg width="${w}" height="${h}" viewBox="0 0 60 100" fill="none"><path d="M30 2 C50 10 62 40 55 70 C48 90 35 98 30 98 C25 98 12 90 5 70 C-2 40 10 10 30 2Z" fill="${color}" opacity="${op}"/><path d="M30 98 L30 2" stroke="${color}" stroke-width="2" opacity="${op*0.3}"/></svg>`;
}
function sprigSVG(w, h, color, op) {
  return `<svg width="${w}" height="${h}" viewBox="0 0 80 100" fill="none"><path d="M40 95 L40 20" stroke="${color}" stroke-width="3" stroke-linecap="round" opacity="${op}"/><ellipse cx="20" cy="55" rx="18" ry="28" transform="rotate(-30 20 55)" fill="${color}" opacity="${op}"/><ellipse cx="60" cy="45" rx="16" ry="24" transform="rotate(25 60 45)" fill="${color}" opacity="${op*0.9}"/><ellipse cx="35" cy="22" rx="14" ry="20" fill="${color}" opacity="${op*0.85}"/></svg>`;
}
function berrySVG(sz, color, op) {
  return `<svg width="${sz*3}" height="${sz*3}" viewBox="0 0 60 60"><circle cx="15" cy="40" r="${sz*0.6}" fill="${color}" opacity="${op}"/><circle cx="35" cy="38" r="${sz*0.55}" fill="${color}" opacity="${op}"/><circle cx="45" cy="25" r="${sz*0.5}" fill="${color}" opacity="${op*0.9}"/><circle cx="25" cy="22" r="${sz*0.45}" fill="${color}" opacity="${op*0.85}"/></svg>`;
}
function dotsSVG(color, op) {
  return `<svg width="50" height="50" viewBox="0 0 50 50"><circle cx="10" cy="10" r="5" fill="${color}" opacity="${op}"/><circle cx="30" cy="8" r="4" fill="${color}" opacity="${op*0.8}"/><circle cx="44" cy="20" r="3.5" fill="${color}" opacity="${op*0.7}"/><circle cx="20" cy="30" r="3" fill="${color}" opacity="${op*0.75}"/><circle cx="40" cy="38" r="4.5" fill="${color}" opacity="${op*0.65}"/></svg>`;
}
function renderDecos(s, density) {
  const colors = (SEASONS[s] || SEASONS.fall).decos;
  const rand = seededRand(12345);
  const types = ['leaf','leaf','leaf','sprig','berry','dots'];
  let html = '';
  for(let i=0;i<Math.floor(density);i++) {
    const type  = types[Math.floor(rand()*types.length)];
    const x     = rand()*92+2, y = rand()*90+2;
    const rot   = rand()*360;
    const color = colors[Math.floor(rand()*colors.length)];
    const scale = 0.5+rand()*1.0;
    const op    = 0.4+rand()*0.45;
    const sz    = Math.round(40*scale);
    let svg = '';
    if(type==='leaf')  svg = leafSVG(sz, sz*5/3, color, op);
    else if(type==='sprig') svg = sprigSVG(sz*1.3, sz*1.7, color, op);
    else if(type==='berry') svg = berrySVG(sz*0.3, color, op);
    else svg = dotsSVG(color, op);
    html += `<div style="position:absolute;left:${x}%;top:${y}%;transform:rotate(${rot}deg);pointer-events:none;z-index:0">${svg}</div>`;
  }
  return html;
}

/* A real QR code for an address (E4-EL-12): qrcode-generator (MIT, 05q-qrcode-lib.js), error correction M, with the
   standard 4-module quiet margin so phones scan it. Returns null without an address. */
function qrCodeSVG(url, size) {
  if (!url || typeof qrcode !== 'function') return null;
  try {
    var q = qrcode(0, 'M'); q.addData(String(url)); q.make();
    var n = q.getModuleCount(), c = size / (n + 8), d = '';

/* ── Menu Planning: card display ──

   Food groups are the reimbursable meal components, shown as letter chips like the TV app. */
var FOOD_GROUPS = {

/* escHtml: src/modules/html.js */

function renderMenuCards(el, df, bf) {
  var w = el.w || 820, h = el.h || 680;

  var _mf = filterMenuItems(_mp.items, el);
  if (_mf.hiddenByLine) return lineHiddenHTML();
  var maxN = el.maxItems || 4, off = el._itemOffset || 0;
  var items = _mf.items.slice(off * maxN, (off + 1) * maxN);

  var showPhoto = el.showImages !== false;
  var style = el.cardStyle || 'large';
  if (style === 'overlay' && !showPhoto) style = 'large';   /* overlay needs a photo to sit on */
  var showFG = el.showFoodGroups !== false, showPrice = el.showPrice !== false, showDesc = el.showDesc !== false;

  var ncols = (el._sectionCat || keepsDesignedGrid(el)) ? Math.max(1, el.cols || 2)   /* the designed columns (sections line up) */
            : Math.max(1, Math.min(el.cols || 2, items.length || 1));
  var nrows = Math.max(1, Math.ceil(gridSlots(el, items.length) / ncols));   /* the designed grid, or the items when filling */
  var fsMult = el.fontSize === 'sm' ? 0.78 : el.fontSize === 'lg' ? 1.28 : el.fontSize === 'xl' ? 1.6 : 1.0;

  var dark = el.theme === 'dark';
  var boxBg  = el.transparent ? 'transparent' : (dark ? '#1a1a22' : '#ffffff');
  var cardBg = dark ? '#262631' : '#ffffff';

  var shadow = dark ? 'none' : '0 6px 18px rgba(17,17,24,.10)';
  var nameC  = el.nameColor || (dark ? '#f2f0ff' : '#111118');
  var descC  = el.descColor || (dark ? 'rgba(255,255,255,.62)' : '#5c5c6b');
  var calC   = el.calColor  || descC;
  var priceC = el.priceColor || '#5249D2';
  var hdrC   = el.headerColor || '#5249D2';
  var ffD    = "font-family:'" + df + "',sans-serif";

  var pad  = Math.round(Math.min(w, h) * 0.02);
  var gap  = Math.round(Math.min(w, h) * 0.022);
  var fsSec = Math.max(8, Math.round(h * 0.048 * fsMult));
  var secH  = el.showSectionHeader ? Math.round(fsSec * 2.4) : 0;
  var cellW = Math.floor((w - pad * 2 - gap * (ncols - 1)) / ncols);
  var cellH = Math.max(40, Math.floor((h - secH - pad * 2 - gap * (nrows - 1)) / nrows));
  var radius = Math.min(18, Math.round(Math.min(cellW, cellH) * 0.05));

  /* Text scales with the card's text area so 1-up and 8-up both read well */
  var photoH = Math.round(cellH * 0.56);
  var photoW = Math.min(Math.round(cellW * 0.4), cellH);
  var fsName = style === 'large'   ? Math.min((cellH - (showPhoto ? photoH : 0)) * 0.2, cellW * 0.07)
             : style === 'compact' ? Math.min(cellH * 0.19, (cellW - (showPhoto ? photoW : 0)) * 0.09)
             :                       Math.min(cellH * 0.1, cellW * 0.08);
  fsName = Math.max(10, Math.round(fsName * fsMult));
  var fsDesc = Math.max(8, Math.round(fsName * 0.62));
  var fsMeta = Math.max(8, Math.round(fsName * 0.6));
  var chip   = Math.max(12, Math.round(fsName * 0.85));
  var cpad   = Math.max(6, Math.round(fsName * 0.75));
  var cgap   = Math.max(2, Math.round(fsName * 0.3));
  var nameW  = Math.max(40, (style === 'compact' && showPhoto ? cellW - photoW : cellW) - cpad * 2);   /* the name's text width */

  /* Description gets the lines the card can actually fit (names may take 2 lines) */
  var textH = style === 'large' ? cellH - (showPhoto ? photoH : 0) : cellH;
  var fixedH = cpad * 2 + fsName * 1.12 * 2 + cgap * 2 + chip;
  var descRoom = Math.floor((textH - fixedH) / (fsDesc * 1.3));
  var descLines = Math.max(showDesc ? 1 : 0, Math.min(style === 'large' ? 2 : 1, descRoom));   /* switched on: at least one line */

  function clamp(lines) { return 'display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:' + lines + ';overflow:hidden;'; }
  function nameHTML(it, onPhoto) {
    return '<div style="overflow-wrap:break-word;font-size:' + fitNameSize(it.mktName, nameW, 2, fsName) + 'px;font-weight:800;line-height:1.12;color:' + (onPhoto ? ((el._manualColor && el.nameColor) || '#ffffff') : nameC) + ';' + ffD + '">' + escHtml(it.mktName) + newPill(it, fsName, el) + '</div>';
  }
  function descHTML(it, lines, onPhoto) {
    var dCol = onPhoto ? ((el._manualColor && el.descColor) || 'rgba(255,255,255,.82)') : descC, ol = optionLinesHTML(it, el, fsDesc, dCol);   /* options and add-ons */
    if (!showDesc || !it.desc || lines < 1) return ol;
    return '<div style="' + clamp(lines) + 'font-size:' + fsDesc + 'px;line-height:1.3;color:' + dCol + '">' + escHtml(it.desc) + '</div>' + ol;
  }
  function metaHTML(it, onPhoto) {
    var bits = [];
    var calCol = onPhoto ? ((el._manualColor && el.calColor) || 'rgba(255,255,255,.88)') : calC;
    if (el.showCal) bits.push('<span style="font-size:' + fsMeta + 'px;white-space:nowrap;color:' + calCol + '">' + it.cal + ' cal</span>');
    nutrientBits(it, el).forEach(function(t) { bits.push('<span class="nutri" style="font-size:' + fsMeta + 'px;white-space:nowrap;color:' + calCol + '">' + t + '</span>'); });
    if (showFG && it.fg && it.fg.length) bits.push('<span style="display:inline-flex;gap:' + Math.max(2, Math.round(chip * 0.2)) + 'px">' + fgChips(it.fg, chip) + '</span>');
    if (el.showAllergens && it.al && it.al.length) bits.push('<span style="display:inline-flex;gap:2px">' + alBadges(it.al, chip) + '</span>');
    var price = showPrice && it.price
      ? '<span style="margin-left:auto;font-size:' + Math.round(fsName * 0.9) + 'px;font-weight:800;white-space:nowrap;color:' + (onPhoto ? ((el._manualColor && el.priceColor) || '#ffffff') : priceC) + ';' + ffD + '">' + escHtml(it.price) + '</span>'
      : '';
    if (!bits.length && !price) return '';
    return '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:' + Math.round(fsMeta * 0.6) + 'px;margin-top:auto">' + bits.join('') + price + '</div>';
  }
  function photoHTML(it, onDark) {
    if (photoSrc(it.img)) return '<img src="' + escHtml(photoSrc(it.img)) + '" alt="" referrerpolicy="no-referrer" style="display:block;width:100%;height:100%;object-fit:cover">';
    /* No photo yet: the placeholder (the category's icon on a neutral panel), never an emoji */
    return itemPlaceholderHTML(it, Math.min(style === 'compact' ? photoW : cellW, style === 'large' ? photoH : cellH), onDark ? '#2c2c38' : (dark ? 'rgba(255,255,255,.06)' : '#F3F0EA'), onDark || dark);
  }

  var cardBase = 'box-sizing:border-box;height:' + cellH + 'px;border-radius:' + radius + 'px;overflow:hidden;';
  var cards = items.map(function(it) {
    if (style === 'overlay') {
      return '<div data-card="overlay" style="' + cardBase + 'position:relative;background:#1b1b22;box-shadow:' + shadow + '">'
        + '<div style="position:absolute;top:0;left:0;right:0;bottom:0">' + photoHTML(it, true) + '</div>'
        + '<div style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:' + cgap + 'px;padding:' + (cpad * 3) + 'px ' + cpad + 'px ' + cpad + 'px;'
        + 'background:linear-gradient(to top,rgba(8,8,14,.9) 0%,rgba(8,8,14,.6) 55%,rgba(8,8,14,0) 100%)">'
        + nameHTML(it, true) + descHTML(it, Math.min(1, descLines), true) + metaHTML(it, true)
        + '</div></div>';
    }
    var body = '<div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:' + cgap + 'px;padding:' + cpad + 'px">'
      + nameHTML(it, false) + descHTML(it, descLines, false) + metaHTML(it, false) + '</div>';
    if (style === 'compact') {
      return '<div data-card="compact" style="' + cardBase + 'display:flex;flex-direction:row;background:' + cardBg + ';border:' + edge + ';box-shadow:' + shadow + '">'
        + (showPhoto ? '<div style="width:' + photoW + 'px;flex-shrink:0">' + photoHTML(it, false) + '</div>' : '')
        + body + '</div>';
    }
    return '<div data-card="large" style="' + cardBase + 'display:flex;flex-direction:column;background:' + cardBg + ';border:' + edge + ';box-shadow:' + shadow + '">'
      + (showPhoto ? '<div style="height:' + photoH + 'px;flex-shrink:0">' + photoHTML(it, false) + '</div>' : '')
      + body + '</div>';
  }).map(function(h, i){ return withItemEnter(h, el, i); }).join('');

  var secHdr = el.showSectionHeader
    ? '<div style="font-size:' + fsSec + 'px;font-weight:800;color:' + hdrC + ';text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid ' + hdrC
      + ';padding-bottom:' + Math.round(fsSec * 0.4) + 'px;margin-bottom:' + Math.round(fsSec * 0.5) + 'px;' + ffD + '">' + period + menuLabelSuffix(el) + '</div>'
    : '';
  return '<div style="width:100%;height:100%;box-sizing:border-box;overflow:hidden;padding:' + pad + 'px;background:' + boxBg + ';border-radius:8px;'
    + "font-family:'" + bf + "',sans-serif" + '">' + secHdr
    + '<div style="display:grid;grid-template-columns:repeat(' + ncols + ',minmax(0,1fr));gap:' + gap + 'px">' + cards + '</div></div>';
}

/* ── Motion: entrance effects + slide transitions ──
   Plays only in Present, the device line-playback preview and the Preview motion window
   (motionOn is set around those renders). The editing canvas, thumbnails and Deck Builder
   preview re-render on every edit, so they always stay still. */
var motionOn = false;
var ENTER_FX = { fade: 'sctvEnterFade', 'fade-up': 'sctvEnterFadeUp', zoom: 'sctvEnterZoom', 'slide-left': 'sctvEnterSlideLeft', 'slide-right': 'sctvEnterSlideRight' };
var ENTER_TYPES = ['headline', 'tagline', 'callout', 'badge', 'labelbar', 'image', 'img-upload', 'rectangle', 'circle', 'triangle', 'menu-board', 'menu-list'];
var ENTER_STAGGER_MS = 120;   /* menu items enter one after another */

/* Inline animation for an element (or one of its menu items), or '' when it shouldn't animate */
function enterAnim(el, extraDelayMs) {
  if (!motionOn || !el || !ENTER_FX[el.enter] || ENTER_TYPES.indexOf(el.type) < 0) return '';
  var delay = Math.round((el.enterDelay || 0) * 1000) + (extraDelayMs || 0);
  var ease = el.enter === 'zoom' ? 'cubic-bezier(.2,.8,.2,1)' : 'cubic-bezier(.25,.7,.3,1)';
  return 'animation:' + ENTER_FX[el.enter] + ' 700ms ' + ease + ' ' + delay + 'ms both;';
}

/* Give one menu row/tile/card its staggered entrance: add the animation to its outer div */
function withItemEnter(html, el, idx) {
  var a = enterAnim(el, idx * ENTER_STAGGER_MS);
  if (!a) return html;
  var end = html.indexOf('>');
  var tag = html.slice(0, end), rest = html.slice(end);
  if (tag.indexOf('<div') !== 0 || tag.indexOf('style="') < 0) return html;
  tag = tag.replace('style="', 'style="' + a);
  tag = tag.indexOf('class="') >= 0 ? tag.replace('class="', 'class="sctv-anim ') : tag.replace('<div', '<div class="sctv-anim"');
  return tag + rest;
}

/* Render one element for playback. Whole-element entrances play in their own full-board layer,
   so the element's own transform (rotation) is never overwritten; menus animate per item. */
function renderPlaybackEl(el) {
  var h = renderOneEl(el);
  if (el.type === 'menu-board' || el.type === 'menu-list') return h;
  var a = enterAnim(el);
  return a ? '<div class="sctv-motion-layer sctv-anim" style="' + a + '">' + h + '</div>' : h;
}

/* Zoom from each element's own centre (text elements have no stored size, so measure) */
function fixMotionOrigins(root) {
  Array.prototype.forEach.call(root.querySelectorAll('.sctv-motion-layer'), function(layer) {
    var t = layer.firstElementChild;
    if (t) layer.style.transformOrigin = (t.offsetLeft + t.offsetWidth / 2) + 'px ' + (t.offsetTop + t.offsetHeight / 2) + 'px';
  });
}

/* Show a rendered slide inside a playback container.
   'fade' = fade through black: the old slide fades out completely, then the new one fades in, so two
   slides are never on screen together. The new slide is added only when it starts to appear,
   so its entrance animations play in view. 'cut' = instant. */
var SLIDE_FADE_MS = 400;
function showSlideLayer(container, html, bg, transition) {
  var layer = document.createElement('div');
  layer.className = 'sctv-slide-layer';
  layer.style.background = bg;
  layer.innerHTML = html;
  if (container._swapTimer) { clearTimeout(container._swapTimer); container._swapTimer = null; }   /* a newer slide wins */
  var old = Array.prototype.slice.call(container.querySelectorAll(':scope > .sctv-slide-layer'));
  Array.prototype.slice.call(container.childNodes).forEach(function(n) { if (old.indexOf(n) < 0) container.removeChild(n); });
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function insert(fadeIn) {
    old.forEach(function(o) { if (o.parentNode) o.remove(); });
    if (fadeIn) layer.style.opacity = '0';
    container.appendChild(layer);
    fixMotionOrigins(layer);
    if (fadeIn) { void layer.offsetWidth; layer.style.opacity = '1'; }
  }
  if (transition === 'cut' || !old.length || reduce) { insert(false); return layer; }
  container.style.background = '#000';   /* dip to black: never brighter than the slides around it */
  old.forEach(function(o) { o.style.opacity = '0'; });
  container._swapTimer = setTimeout(function() { container._swapTimer = null; insert(true); }, SLIDE_FADE_MS);
  return layer;
}

function setDeckTransition(t) {
  if (!currentDeck) return;
  currentDeck.transition = t;
  buildDeckThemePanel();
}

/* Board Designer: play the current board's entrances in a window (the canvas itself stays still) */
function openMotionPreview() {
  closeMotionPreview();
  var portrait = typeof orientation !== 'undefined' && orientation === 'portrait';
  var bw = portrait ? 1080 : 1920, bh = portrait ? 1920 : 1080;
  var ov = document.createElement('div');
  ov.id = 'motionPreview';
  ov.className = 'lpb-overlay';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-label', 'Motion preview');
  ov.onclick = function(e) { if (e.target === ov) closeMotionPreview(); };
  ov.innerHTML = '<div class="lpb-card" style="width:min(' + (portrait ? 620 : 1180) + 'px,100%)">'
    + '<div class="lpb-hdr"><div class="lpb-hdr-text"><div class="lpb-title">Motion preview</div>'
    + '<div class="lpb-sub">How this board enters on the TV. The editing canvas stays still.</div></div>'
    + '<button class="btn-reset" onclick="playMotionPreview()">Replay</button>'
    + '<button class="btn-reset" onclick="closeMotionPreview()" aria-label="Close preview">&#x2715;</button></div>'
    + '<div class="lpb-stage" id="mpStage"><div id="mpBoard" style="position:absolute;top:0;left:0;width:' + bw + 'px;height:' + bh + 'px;transform-origin:0 0;overflow:hidden"></div></div>'
    + '</div>';
  document.body.appendChild(ov);
  document.addEventListener('keydown', motionPreviewKey);

function playMotionPreview() {
  var pb = document.getElementById('mpBoard'), stage = document.getElementById('mpStage');
  if (!pb || !stage) return;
  var bw = pb.offsetWidth, bh = pb.offsetHeight, scale = stage.clientWidth / bw;

  stage.style.height = Math.round(bh * scale) + 'px';
  var bg = elements.find(function(e) { return e.type === 'background'; });
  var prevSel = selectedId, prevMotion = motionOn, html;
  try { selectedId = null; motionOn = true; if (typeof beginBoardKeys === 'function') beginBoardKeys(); html = elements.map(renderPlaybackEl).join(''); if (typeof fillDietKeys === 'function') html = fillDietKeys(html); }
  finally { selectedId = prevSel; motionOn = prevMotion; }
  showSlideLayer(pb, html, bg ? bg.bg : '#ffffff', 'cut');

function closeMotionPreview() {
  var ov = document.getElementById('motionPreview');
  if (ov) ov.remove();

   renderBoardHTML(board, opts) -> { html, background }

     opts.deck, opts.slide  apply the deck theme (colours, fonts, background) for this slide
     opts.page              overflow page of a paged menu (boardPageCount counts them)
     opts.countPages        return { pages } instead of drawing (same context)
     opts.servingLine       { line, mode } the active serving line (null = none)
     opts.meal              { type, mode, endedTypes } the active meal (device playback)
     opts.school            school id whose own lines and menus to use (a screen's school)
     opts.categories        a screen's categories for this board (replace every menu's own; null = the board's)

   six functions that had drifted apart (Present ignored the deck theme). */
var renderDataOverride = null;   /* supplied data, read by the storage getters before storage */

function applySchoolBrand(els) {
  var bg = (els || []).find(function(e) { return e.type === 'background'; });
  if (!bg || bg.themeId !== 'th-district-brand') return els;
  var bc = (renderDataOverride && renderDataOverride.brandColors) || (typeof getBrandColors === 'function' ? getBrandColors() : null);

  var map = {};
  ['primary', 'secondary', 'accent', 'neutral'].forEach(function(k) { if (ov[k] && bc.district[k] && String(ov[k]).toLowerCase() !== String(bc.district[k]).toLowerCase()) map[String(bc.district[k]).toLowerCase()] = ov[k]; });
  if (!Object.keys(map).length) return els;
  var sw = function(v) { if (typeof v === 'string') return map[v.toLowerCase()] || v; if (Array.isArray(v)) return v.map(sw); if (v && typeof v === 'object') { var o = {}; Object.keys(v).forEach(function(k) { o[k] = sw(v[k]); }); return o; } return v; };
  return els.map(sw);
}

function setCTab(t) {
  if(t==='canvas') setTimeout(buildGlobalMenuUI,0);
  document.querySelectorAll('.ctab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.ctp').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.ctab[onclick="setCTab('${t}')"]`)?.classList.add('active');
  document.getElementById('ctp-'+t)?.classList.add('active');
}



function setOrientation(o) {
  orientation=o; canvasCustom = null;   /* a preset replaces a custom size */
  ['landscape','portrait'].forEach(x=>document.getElementById('o-'+x)?.classList.toggle('active',x===o));
  sizeCanvas(); renderBoard();
}

function resetBoard() {
  askConfirm('Reset this board to the default layout? Unsaved changes will be lost.', 'Reset board', function() {
    makeDefault();
    selectedId=null;
    renderBoard(); buildLayerPanel(); buildElementControls(null);

}

  const html = document.getElementById('boardOuter').outerHTML;

}

function getTopNItems(period, rankBy, n) {
  if (period === 'current' && typeof currentMealType === 'function') period = currentMealType();   /* 'current' is the meal being served (callouts found nothing and showed an emoji) */
  var items = (MENU_DATA[period] || []).slice();
  if(rankBy === 'count') {
    items.sort(function(a,b){ return (COUNTS[b.id]||0)-(COUNTS[a.id]||0); });
  }
  return items.slice(0, n||3);
}

/* File input delegation — avoids inline onclick with id escaping */
document.addEventListener('change', function(e) {
  var input = e.target;
  if(!input.dataset.uploadFor) return;
  var elId = input.dataset.uploadFor;
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var el = elements.find(function(x){ return x.id===elId; });
    if(el) { el.src = ev.target.result; renderBoard(); buildElementControls(elId); }
  };
  reader.readAsDataURL(file);
});

/* Click on placeholder opens file picker */
document.addEventListener('click', function(e) {
  var ph = e.target.closest('[data-upload-click]');
  if(!ph) return;
  var inp = document.getElementById('upload_' + ph.dataset.uploadClick);
  if(inp) inp.click();
});

function getBoardIndex() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveBoardIndex(idx) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(idx)); } catch(e){}
}
function loadBoardData(id) {
  try { return migrateCoffeeElements(JSON.parse(localStorage.getItem(STORAGE_KEY+'_'+id) || 'null')); }
  catch(e) { return null; }
}
function deleteBoardData(id) {
  try { localStorage.removeItem(STORAGE_KEY+'_'+id); } catch(e){}
}

function generateBoardId() {
  return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function currentBoardSnapshot() {
  /* Simple thumbnail: background color + element count info */
  var bg = elements.find(function(x){ return x.type==='background'; });
  return { bg: bg ? bg.bg : '#F5EDD8', season: bg ? bg.season : 'fall', count: elements.length };
}

/* Save, asking first if a colleague saved this board after you opened it (shared designs in Claude) */
function saveBoard() {
  var key = STORAGE_KEY + '_' + window.currentBoardId;
  if (window.currentBoardId && typeof cloudChangedSince === 'function' && cloudChangedSince(key)) {
    askConfirm('A colleague changed this board after you opened it. Save your version over theirs?', 'Save mine', saveBoardNow);
    return;
  }
  saveBoardNow();
}
function saveBoardNow() {
  var nameEl = document.getElementById('boardNameInput');
  var name   = (nameEl && nameEl.value.trim()) || 'Untitled Board';
  var idx    = getBoardIndex();
  /* Check if this board was already saved (has a currentBoardId) */
  var id = window.currentBoardId || generateBoardId();
  window.currentBoardId = id;

  var state = {
    id: id, name: name, savedAt: Date.now(),
    snapshot: currentBoardSnapshot(),
    elements: JSON.parse(JSON.stringify(elements)),
    displayFont: displayFont, bodyFont: bodyFont,
    orientation: orientation, canvasW: canvasCustom ? canvasCustom[0] : undefined, canvasH: canvasCustom ? canvasCustom[1] : undefined, globalMenu: JSON.parse(JSON.stringify(globalMenu)),
    author: 'You',
  };
  try { localStorage.setItem(STORAGE_KEY+'_'+id, JSON.stringify(state)); } catch(e) {
    showToast('Storage full: could not save the board'); return;
  }
  /* Update index */
  var existing = idx.findIndex(function(b){ return b.id===id; });
  var meta = { id:id, name:name, savedAt:Date.now(), snapshot:state.snapshot, author:state.author||'You', dims: canvasDims() };   /* thumbnails keep the board's shape */
  if(existing >= 0) idx[existing] = meta;
  else idx.unshift(meta);
  saveBoardIndex(idx);
  updateSaveButton(name);
  showToast('Board saved: ' + name);
}

function loadBoard(id) {
  hideLanding();
  var state = loadBoardData(id);
  if(!state) { showToast('Board not found'); return; }
  if (typeof cloudNoteOpened === 'function') cloudNoteOpened(STORAGE_KEY + '_' + id);   /* for the overwrite warning */
  elements    = state.elements || elements;
  displayFont = state.displayFont || displayFont;
  bodyFont    = state.bodyFont    || bodyFont;
  orientation = state.orientation || orientation;
  canvasCustom = state.canvasW > 0 && state.canvasH > 0 ? [state.canvasW, state.canvasH] : null;   /* custom board size */
  if(state.globalMenu) Object.assign(globalMenu, state.globalMenu);
  window.currentBoardId = id;
  selectedId = null;
  sizeCanvas(); renderBoard(); buildLayerPanel(); buildGlobalMenuUI();
  syncUIState();
  var nameEl = document.getElementById('boardNameInput');
  if(nameEl) nameEl.value = state.name || 'Untitled Board';
  updateSaveButton(state.name);
  hideGallery();
  showToast('Loaded: ' + state.name);
}


function newBoard() { askConfirm('Start a new board? Unsaved changes will be lost.', 'Start new board', startNewBoard); }
function startNewBoard() {
  window.currentBoardId = null;
  makeDefault(); selectedId = null;
  sizeCanvas(); renderBoard(); buildLayerPanel(); buildGlobalMenuUI();
  var nameEl = document.getElementById('boardNameInput');
  if(nameEl) nameEl.value = 'Untitled Board';
  updateSaveButton('Untitled Board');
  hideGallery();
}

function updateSaveButton(name) {
  var idx  = getBoardIndex();
  var span = document.getElementById('savedCount');
  if(span) span.textContent = idx.length ? '(' + idx.length + ')' : '';
}

function syncUIState() {
  ['landscape','portrait'].forEach(function(x){
    var b = document.getElementById('o-'+x);
    if(b) b.classList.toggle('active', x===orientation);
  });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  if(!t) return;
  t.innerHTML = msg; t.className = 'toast-visible';
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.className=''; setTimeout(function(){t.innerHTML='';},300); }, 2200);
}

function buildGallery() {
  var el = document.getElementById('galleryGrid');
  if(!el) return;
  var idx = getBoardIndex();
  if(!idx.length) {
    el.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;font-size:13px">No saved boards yet. Click Save to save your current board.</div>';
    return;
  }
  el.innerHTML = idx.map(function(b) {
    var snap = b.snapshot || {};
    var date = new Date(b.savedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    var deco = SEASONS[snap.season] || SEASONS.fall;
    var accentCol = deco.decos[0] || '#5249D2';
    return '<div class="gallery-card" onclick="loadBoard(\''+b.id+'\')">'
      + '<div class="gallery-thumb" style="background:'+snap.bg+(b.dims && (b.dims[0] !== 1920 || b.dims[1] !== 1080) ? ';aspect-ratio:'+b.dims[0]+'/'+b.dims[1]+';height:auto;max-height:220px;margin:0 auto' : '')+'">'
      + '<div style="position:absolute;inset:6px;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;gap:3px;padding:6px">'
      + '<div style="height:4px;background:'+accentCol+';border-radius:2px;width:55%;opacity:.9"></div>'
      + '<div style="height:3px;background:'+accentCol+';border-radius:2px;width:38%;opacity:.5"></div>'
      + '<div style="height:2px;background:'+accentCol+';border-radius:2px;width:70%;opacity:.2;margin-top:2px"></div>'
      + '<div style="height:2px;background:'+accentCol+';border-radius:2px;width:60%;opacity:.2"></div>'
      + '<div style="height:2px;background:'+accentCol+';border-radius:2px;width:45%;opacity:.2"></div>'
      + '<div style="height:3px;background:'+accentCol+';border-radius:2px;width:100%;opacity:.35;margin-top:auto"></div>'
      + '</div></div>'
      + '<div class="gallery-info">'
      + '<div class="gallery-name">'+escHtml(b.name)+'</div>'

      + '</div>';
  }).join('');
}


/* ══════════════════════════════════════════════════
   SHAPE PATH GENERATORS  (200×200 viewBox, cx=cy=100)
══════════════════════════════════════════════════ */
function shapePath(name) {
  var cx=100,cy=100,i,a,r,path='';
  switch(name) {
    case 'circle':
      return 'M100,8A92,92,0,1,1,99.9,8Z';
    case 'scallop': { /* wavy badge, like Monday Specials */
      var pts=14,r1=80,bump=13;
      for(i=0;i<pts;i++){
        a=(i/pts)*Math.PI*2-Math.PI/2;
        var am=((i+0.5)/pts)*Math.PI*2-Math.PI/2;
        path+=(i===0?'M':'L')+(cx+r1*Math.cos(a)).toFixed(1)+','+(cy+r1*Math.sin(a)).toFixed(1)+'L'+(cx+(r1+bump)*Math.cos(am)).toFixed(1)+','+(cy+(r1+bump)*Math.sin(am)).toFixed(1);
      }
      return path+'Z';
    }
    case 'star': { /* 5-point star */
      for(i=0;i<10;i++){
        a=(i*Math.PI/5)-Math.PI/2; r=i%2===0?90:38;
        path+=(i===0?'M':'L')+(cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1);
      }
      return path+'Z';
    }
    case 'burst': { /* 12-point starburst */
      for(i=0;i<24;i++){
        a=(i*Math.PI/12)-Math.PI/2; r=i%2===0?90:68;
        path+=(i===0?'M':'L')+(cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1);
      }
      return path+'Z';
    }
    case 'stamp': { /* octagonal stamp */
      var r2=88,pts2=8;
      for(i=0;i<pts2;i++){
        a=((i+0.5)/pts2)*Math.PI*2-Math.PI/2;
        path+=(i===0?'M':'L')+(cx+r2*Math.cos(a)).toFixed(1)+','+(cy+r2*Math.sin(a)).toFixed(1);
      }
      return path+'Z';
    }
    case 'flame':
      /* teardrop/flame using cubic beziers */
      return 'M100,14 C126,14 148,36 152,62 C158,94 148,118 132,138 C120,152 112,162 100,172 C88,162 80,152 68,138 C52,118 42,94 48,62 C52,36 74,14 100,14Z';
    case 'hex': { /* hexagon */
      for(i=0;i<6;i++){
        a=(i/6)*Math.PI*2-Math.PI/6;
        path+=(i===0?'M':'L')+(cx+88*Math.cos(a)).toFixed(1)+','+(cy+88*Math.sin(a)).toFixed(1);
      }
      return path+'Z';
    }
    default: return '';
  }
}

var SHAPES = [
  {id:'none',   label:'None'},
  {id:'circle', label:'Circle'},
  {id:'scallop',label:'Scallop'},
  {id:'burst',  label:'Burst'},
  {id:'star',   label:'Star'},
  {id:'stamp',  label:'Stamp'},
  {id:'flame',  label:'Flame'},
  {id:'hex',    label:'Hex'},
];

function shapeLayer(name, color, w, h) {
  if(!name || name==='none') return '';
  var d = shapePath(name);
  if(!d) return '';
  return '<svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="'+d+'" fill="'+color+'"/></svg>';
}

/* Inner circle size as fraction of element size (0–1) */
var SHAPE_INNER = { none:0, circle:0.72, scallop:0.62, burst:0.58, star:0.52, stamp:0.68, flame:0.58, hex:0.68 };

function shapePickerHTML(elId, current, colorProp) {
  var cur = current || 'none';
  return SHAPES.map(function(s){
    var isA = cur===s.id;
    var preview = s.id==='none'
      ? '<div style="width:100%;height:100%;border:1.5px dashed var(--border2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)">—</div>'
      : '<svg viewBox="0 0 200 200" style="width:100%;height:100%"><path d="'+shapePath(s.id)+'" fill="'+(isA?'var(--brand)':'rgba(82,73,210,.3)')+'"/></svg>';
    return '<div onclick="setElProp(\''+elId+'\',\'shape\',\''+s.id+'\')" style="cursor:pointer;border-radius:5px;border:1.5px solid '+(isA?'var(--brand)':'var(--border)')+';background:'+(isA?'rgba(82,73,210,.1)':'transparent')+';padding:3px;aspect-ratio:1;overflow:hidden;transition:all .12s" title="'+escHtml(s.label)+'">'
      + preview + '</div>';
  }).join('');
}

function setShapeColor(prop, val) {
  if(!selectedId) return;
  setElProp(selectedId, prop, val);
}


/* ── Photo frame (one section for an image's frame) ─────────────────────────────────────────────────────────────
   Replaces Frame Shape, Frame Color, Crop / Shape, Shape Style and Shape Color, which all edited the same two settings.
   Photos: Rectangle (corner radius), Circle, Plate (rim colour) or one of the shapes (frame colour); choosing Rectangle,
   Circle or Plate keeps the shape remembered, so choosing it again restores it. Food emoji: No frame or a shape. Stored as

/* ── Designs baked into an exported file (Export File) ────────────────────────────────────────────────
   Boards and decks travel inside the exported copy. When it opens, each embedded design is installed if this
   browser doesn't have it, or replaces the local copy when the embedded one is newer (savedAt). Runs after the
   built-in demo boards are created, so an export's versions win over the demo defaults. */
function initEmbeddedDesigns() {
  var changed = 0;
  if (EMBEDDED_BOARDS && EMBEDDED_BOARDS.length) {
    var idx = getBoardIndex();
    EMBEDDED_BOARDS.forEach(function(board) {
      var local = loadBoardData(board.id);
      if (local && (local.savedAt || 0) >= (board.savedAt || 0)) return;
      try { localStorage.setItem(STORAGE_KEY+'_'+board.id, JSON.stringify(board)); } catch(e){ return; }
      var meta = { id:board.id, name:board.name, savedAt:board.savedAt, snapshot:board.snapshot, author:board.author };
      var i = idx.findIndex(function(m) { return m.id === board.id; });
      if (i >= 0) idx[i] = Object.assign({}, idx[i], meta); else idx.unshift(meta);
      changed++;
    });
    if (changed) saveBoardIndex(idx);
  }
  (EMBEDDED_DECKS || []).forEach(function(deck) {
    var local = loadDeckData(deck.id);
    if (local && (local.savedAt || 0) >= (deck.savedAt || 0)) return;
    if (saveDeckToStorage(deck)) changed++;
  });
  return changed;
}
function initEmbeddedBoards() { return initEmbeddedDesigns(); }   /* older name */

/* ── Export File: the user's boards and decks, to send back for the next build or to share ── */
function collectDesignExport() {

    format: 'sctv-designs', version: 1, exportedAt: new Date().toISOString(),
    boards: getBoardIndex().map(function(m) { return loadBoardData(m.id); }).filter(Boolean),
    decks: getDeckIndex().map(function(m) { return loadDeckData(m.id); }).filter(Boolean),

/* Which build and saved state this browser has (for matching a user's report to a build) */

  for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf('sctv_') === 0) storage[k] = (localStorage.getItem(k) || '').length; }

/* The page's own source with the designs written into its three markers (works on an already-exported file too) */
function buildExportHTML(html, pkg) {
  var put = function(src, name, marker, value) {
    var json = JSON.stringify(value).replace(/<\/(script)/gi, '<\\/$1');
    var line = 'var ' + name + ' = ' + json + '; /* ' + marker + ' */';
    var re = new RegExp('var ' + name + ' = (?:null|\\[[\\s\\S]*?\\]|\\{[\\s\\S]*?\\}); \\/\\* ' + marker + ' \\*\\/');
    return src.replace(re, function() { return line; });
  };
  html = put(html, 'EMBEDDED_BOARDS', 'BOARD_EMBED_MARKER', pkg.boards);
  html = put(html, 'EMBEDDED_DECKS', 'DECK_EMBED_MARKER', pkg.decks);

function exportWithBoards() {
  /* A small designs file (boards, decks and display lists): all that's needed to send changes back for the next build */
  var pkg = collectDesignExport();
  if (!pkg.boards.length && !pkg.decks.length) { showToast('Nothing to export yet'); return; }
  var what = pkg.boards.length + ' board' + (pkg.boards.length !== 1 ? 's' : '') + ', ' + pkg.decks.length + ' deck' + (pkg.decks.length !== 1 ? 's' : '')
    + ' and ' + pkg.menuLists.length + ' display list' + (pkg.menuLists.length !== 1 ? 's' : '');
  saveExportFile(JSON.stringify(pkg, null, 1), 'sctv-designs-' + pkg.exportedAt.slice(0, 10) + '.json', 'application/json',
    'Exported ' + what + ': send this file back to include them in the next build');
}
function saveExportFile(text, filename, type, message) {
  if (typeof CLOUD !== 'undefined' && CLOUD.downloads) {   /* the published link: Claude's download (the viewer confirms) */
    CLOUD.downloads.save({ filename: filename, data: new Blob([text], { type: type }) }).then(function(r) {
      showToast(r && r.saved === false ? 'Download cancelled' : message);
    }, function(e) { showToast(e && e.code === 'declined' ? 'Download cancelled' : 'Couldn\u2019t download: ' + ((e && (e.message || e.code)) || 'error')); });
    return;
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 2000);
  showToast(message);
}

function setDeckThemeProp(key, val) {
  if(!currentDeck) return;
  if(!currentDeck.theme) currentDeck.theme = {};

  }
  buildDeckThemePanel();

/* Apply deck theme overrides to a board's elements before rendering */
function applyDeckTheme(boardElements, slide) {
  var th = currentDeck && currentDeck.theme;
  if(!th || !th.active) return boardElements;
  if(slide && slide.useGlobalTheme === false) return boardElements;
  var pal = th.palette;
  if(!pal || !pal.primary) {
    var bc = typeof getBrandColors === 'function' ? getBrandColors() : {district:{primary:'#5249D2',secondary:'#1D4ED8',accent:'#F59E0B',neutral:'#1E1B3A'}};
    var src = th.paletteSource || 'district';
    if(src === 'school' && th.schoolId && bc.schools && bc.schools[th.schoolId]) {
      var sch = bc.schools[th.schoolId];
      pal = {primary:sch.primary, secondary:bc.district.secondary, accent:sch.accent||bc.district.accent, neutral:bc.district.neutral, white:'#FFFFFF'};
    } else {
      pal = {primary:bc.district.primary, secondary:bc.district.secondary, accent:bc.district.accent, neutral:bc.district.neutral, white:'#FFFFFF'};
    }
  }
  var mode = th.mode || 'light';
  var isDark = mode === 'dark' || mode === 'bold';

  return boardElements.map(function(el) {
    var e = JSON.parse(JSON.stringify(el));
    if(e._manualColor) return e;

    switch(e.type) {
      case 'background':
        if(th.bgColor) e.bg = th.bgColor;
        else if(pal.neutral) e.bg = pal.neutral;
        break;
      case 'headline':
        if(pal.primary) e.color = pal.primary;
        break;
      case 'tagline':
      case 'callout':
      case 'textblock':
        e.color = isDark ? (pal.white || '#FFFFFF') : (pal.neutral || e.color);
        break;
      case 'footer':
        if(pal.secondary) e.bg = pal.secondary;
        if(pal.white) e.color = pal.white;
        break;
      case 'rectangle': case 'circle': case 'triangle': case 'arrow': case 'line':
        if(pal.secondary) e.bg = pal.secondary;
        break;
      case 'labelbar':
        if(pal.primary) e.bg = pal.primary;
        if(pal.white) e.color = pal.white;
        break;
      case 'menu-list':
        if(pal.primary) e.headerColor = pal.primary;
        if(pal.accent) e.priceColor = pal.accent;
        e.nameColor = isDark ? (pal.white || '#FFFFFF') : (pal.neutral || e.nameColor);
        if(mode !== 'none' && mode) e.theme = mode;
        break;
      case 'menu-board':
        if(mode !== 'none' && mode) e.theme = mode;
        break;
    }
    return e;
  });
}

/* Detect how many overflow pages a board needs */
function getOverflowPages(board) {
  if(!board || !board.elements) return 1;
  var menuEl = board.elements.find(function(e){ return e.type==='menu-board' || e.type==='menu-list'; });
  if(!menuEl) return 1;
  var period   = (menuEl.useGlobal && currentDeck && currentDeck.globalMenu && currentDeck.globalMenu.active)
                   ? (currentDeck.globalMenu.period || 'Lunch')
                   : (menuEl.period || 'Lunch');
  var allItems = (menuEl.type === 'menu-board' ? menuPlanningItems(menuEl).items : (MENU_DATA[period] || [])).length;
  var perPage  = menuEl.maxItems || allItems;
  if(!perPage || perPage <= 0 || perPage >= allItems) return 1;
  return Math.ceil(allItems / perPage);
}

/* Get the effective slide list (with overflow pages expanded) */
/* 1:1 — overflow is a runtime player concern */
function getExpandedSlides() {
  if(!currentDeck) return [];
  return (currentDeck.slides||[]).map(function(sl,i){ return {slide:sl,baseIdx:i,page:0,totalPages:1}; });
}
function slideHasOverflow(sl) {
  var board = resolveBoardForSlide(sl);
  if(!board||!board.elements) return false;
  return board.elements.some(function(e){ return (e.type==='menu-board'||e.type==='menu-list')&&e.allowOverflow; });
}

/* Patch menu element item offset for a given page */
function patchElementsForPage(elements, page) {
  if(page === 0) return elements;
  return elements.map(function(el) {
    if(el.type !== 'menu-board' && el.type !== 'menu-list') return el;
    if(el.allowOverflow === false || el.groupBy === 'line') return el;   /* keeps its first page */
    var e = JSON.parse(JSON.stringify(el));
    e._itemOffset = page; /* renderMenuBoard/List reads this */
    return e;
  });
}

function renderBoardThumbnail(boardData, containerId, opts) {
  if(!boardData) return;
  var container = document.getElementById(containerId);
  if(!container) return;

  var rect = container.getBoundingClientRect();
  var w = rect.width || container.clientWidth || container.offsetWidth || 200;
  var _bd = boardDims(boardData), SCALE = Math.min(w / _bd[0], (rect.height || w * 9 / 16) / _bd[1]);   /* the board's own shape */

  var inner = document.createElement('div');
  inner.style.cssText = 'position:absolute;top:0;left:' + Math.max(0, (w - _bd[0] * SCALE) / 2) + 'px;width:' + _bd[0] + 'px;height:' + _bd[1] + 'px;'
    + 'transform:scale('+SCALE+');transform-origin:top left;overflow:hidden;pointer-events:none;user-select:none';

  var r = renderBoardHTML(boardData, Object.assign({ defaultBackground: '#F5EDD8' }, opts || {}));
  inner.style.background = r.background;
  inner.innerHTML = r.html;
  container.style.overflow = 'hidden';
  container.style.position = 'relative';
  container.innerHTML = '';
  container.appendChild(inner);

}

/* Render thumbnails after a grid has been built */
function populateBoardThumbnails(boardIndex) {
  requestAnimationFrame(function() {
    boardIndex.forEach(function(meta) {
      var board = loadBoardData(meta.id);
      if(board) renderBoardThumbnail(board, 'thumb_board_'+meta.id);
    });
  });
}

function populateSharedThumbnails() {
  requestAnimationFrame(function() {
    (window.SHARED_BOARDS||[]).forEach(function(b) {
      renderBoardThumbnail(b, 'thumb_shared_'+b.id);

}

function populateDeckThumbnails(deckIndex) {
  requestAnimationFrame(function() {
    deckIndex.forEach(function(meta) {
      var deck = loadDeckData(meta.id);
      if(!deck || !deck.slides || !deck.slides.length) return;
      var board = resolveBoardForSlide(deck.slides[0]);
      if(board) renderBoardThumbnail(board, 'thumb_deck_'+meta.id);
    });
  });
}

var DEFAULT_SITES = [

/* ── Built-in schools and screens added after people saved their lists ──────────────────────────────────
   A browser that saved its lists earlier would never see them (the stored list wins). Each is merged in once:
   the browser remembers which built-ins it has seen, so one the user deleted stays deleted. */
var SEEDS_ADDED_LATER = { sites: ['s042'], devices: ['d042a', 'd042b'] };
function mergeNewSeeds(stored, defaults, kind) {
  var key = 'sctv_seed_seen_' + kind, seen = null, all = defaults.map(function(x) { return x.id; });
  try { seen = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
  if (!Array.isArray(seen)) seen = all.filter(function(id) { return SEEDS_ADDED_LATER[kind].indexOf(id) < 0; });
  var have = stored.map(function(x) { return x.id; }), added = false;
  defaults.forEach(function(d) {
    if (have.indexOf(d.id) < 0 && seen.indexOf(d.id) < 0) { stored.push(JSON.parse(JSON.stringify(d))); added = true; }
  });
  var unseen = all.filter(function(id) { return seen.indexOf(id) < 0; });
  if (unseen.length || !localStorage.getItem(key)) { try { localStorage.setItem(key, JSON.stringify(seen.concat(unseen))); } catch (e) {} }
  return added;
}
/* ── One-time rename of the old sample school (a competitor's name) in saved data ── */
function migrateSampleRename() {
  try { if (localStorage.getItem('sctv_sample_rename_v1')) return; } catch (e) { return; }
  var OLD = 'T' + 'itan';   /* spelled apart so the old name appears nowhere in the page */
  var pairs = [[OLD + ' High School', 'Summit High School'], [OLD + ' Grill', 'Summit Grill']];   /* covers "… Grill Signature" and "… Grill Line" */
  [SCH_SITES_KEY, DEV_KEY, 'sctv_screen_lines', 'sctv_screen_categories', 'sctv_import_maps'].forEach(function(k) {
    var v = localStorage.getItem(k), n = v;
    if (!v) return;
    pairs.forEach(function(p) { n = n.split(p[0]).join(p[1]); });
    if (n !== v) localStorage.setItem(k, n);
  });
  localStorage.setItem('sctv_sample_rename_v1', '1');
}
function getSites() {
  try {
    var s = JSON.parse(localStorage.getItem(SCH_SITES_KEY)||'null');
    if(!s||!s.length) { localStorage.setItem(SCH_SITES_KEY, JSON.stringify(DEFAULT_SITES)); return DEFAULT_SITES; }
    if (mergeNewSeeds(s, DEFAULT_SITES, 'sites')) localStorage.setItem(SCH_SITES_KEY, JSON.stringify(s));   /* new built-in schools */
    return s;
  } catch(e){ return DEFAULT_SITES; }
}

/* ── Currently playing (time-based) ── */
function getCurrentlyPlaying(meals) {
  var c = resolveCurrentMeal(meals, getSchData().afterLastService);
  if (c && c.status === 'off') return '';   /* overnight: nothing playing */   /* the service in progress, otherwise the next one coming up */
  return c ? c.meal.id : (meals[1] ? meals[1].id : 'lunch');
}

/* ── Inheritance resolution ── */
function resolveSchedule(scope, data, meals) {
  meals = meals||data.meals||getDefaultMeals();
  /* Build base from meal defaults */
  var base={};
  meals.forEach(function(m){ base[m.id]=JSON.parse(JSON.stringify(m)); });
  /* Apply district overrides */
  Object.keys(data.district||{}).forEach(function(k){ if(base[k]) Object.assign(base[k], data.district[k]); });
  if(scope.level==='district') return { schedule:base };
  /* Apply type overrides */
  var typeData = data.types&&data.types[scope.typeKey];
  Object.keys(typeData||{}).forEach(function(k){ if(base[k]) Object.assign(base[k], typeData[k]); });
  if(scope.level==='type') return { schedule:base };
  /* Apply site overrides */
  var siteData = data.sites&&data.sites[scope.siteId];
  Object.keys(siteData||{}).forEach(function(k){ if(base[k]) Object.assign(base[k], siteData[k]); });
  return { schedule:base };
}
function getScopeOverrides(scope, data) {
  if(scope.level==='district') return data.district||{};
  if(scope.level==='type') return (data.types&&data.types[scope.typeKey])||{};
  if(scope.level==='site') return (data.sites&&data.sites[scope.siteId])||{};
  return {};
}
function getMealSource(mealId, scope, data) {
  if(scope.level==='district') return 'district';
  if(scope.level==='site'&&data.sites&&data.sites[scope.siteId]&&data.sites[scope.siteId][mealId]) return 'site';
  if(data.types&&data.types[scope.typeKey]&&data.types[scope.typeKey][mealId]) return 'type';
  if(data.district&&data.district[mealId]) return 'district';
  return 'default';
}

/* ══ MEAL ACTIONS ══ */
function addMealPeriod() {
  var label=document.getElementById('newMealName').value.trim();
  if(!label){showToast('Enter a meal name');return;}
  var startH=String(document.getElementById('newMealStartH').value).padStart(2,'0');
  var startM=String(document.getElementById('newMealStartM').value).padStart(2,'0');
  var endH=String(document.getElementById('newMealEndH').value).padStart(2,'0');
  var endM=String(document.getElementById('newMealEndM').value).padStart(2,'0');
  var id=label.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now().toString(36);
  var data=getSchData();
  data.meals.push({id:id,label:label,mealType:mealTypeForLabel(label),active:true,design:null,lines:[],startH:startH,startM:startM,endH:endH,endM:endM});
  saveSchDataFull(data);
  renderScheduleMain();
  showToast('"'+label+'" added');
}


/* ══ SCOPE ACTIONS ══ */
function setSchScope(level,typeKey,siteId){schScope={level:level,typeKey:typeKey,siteId:siteId};renderSchedulePage();}
function setMealField(meal,field,val){var data=getSchData();ensureScopeExists(data);var t=getScopeTarget(data);if(!t[meal])t[meal]={};t[meal][field]=val;saveDraftToScope(data,t);
  setTimeout(renderScheduleMain, 0);   /* saved now; redraw after the event: a field's change fires as it loses focus, and redrawing mid-blur throws (e.g. editing a time, then clicking Save) */
}
function setMealTimeField(meal,field,val){setMealField(meal,field,String(val).padStart(2,'0'));}
function overrideMeal(meal){var data=getSchData();ensureScopeExists(data);var t=getScopeTarget(data);var eff=resolveSchedule(schScope,data);t[meal]=JSON.parse(JSON.stringify(eff.schedule[meal]));saveDraftToScope(data,t);renderScheduleMain();}
function clearMealOverride(meal){var data=getSchData();var t=getScopeTarget(data);if(t&&t[meal])delete t[meal];saveDraftToScope(data,t);renderScheduleMain();}
function resetScopeSchedule(){var data=getSchData();if(schScope.level==='district'){data.district={};}else if(schScope.level==='type'&&schScope.typeKey){if(data.types)delete data.types[schScope.typeKey];}else if(schScope.level==='site'&&schScope.siteId){if(data.sites)delete data.sites[schScope.siteId];}saveSchDataFull(data);renderScheduleMain();}
function saveCurrentScope(){saveSchDataFull(getSchData());showToast('Schedule saved');renderSiteSidebar();}
function ensureScopeExists(data){if(!data.district)data.district={};if(!data.types)data.types={};if(!data.sites)data.sites={};}
function getScopeTarget(data){if(schScope.level==='district')return data.district;if(schScope.level==='type'){if(!data.types[schScope.typeKey])data.types[schScope.typeKey]={};return data.types[schScope.typeKey];}if(schScope.level==='site'){if(!data.sites[schScope.siteId])data.sites[schScope.siteId]={};return data.sites[schScope.siteId];}return{};}
function saveDraftToScope(data,target){ensureScopeExists(data);if(schScope.level==='district')data.district=target;else if(schScope.level==='type')data.types[schScope.typeKey]=target;else if(schScope.level==='site')data.sites[schScope.siteId]=target;saveSchDataFull(data);}
function addSchoolPrompt() {
  sctvDialog({ title: 'Add a school', okLabel: 'Add school',
    fields: [{ label: 'School name', placeholder: 'e.g. Lakeside Elementary' }, { label: 'Type', options: SITE_TYPES.filter(function(t) { return t !== 'District'; }), value: 'Elementary' }],
    onOk: function(v) {
      if (!v[0].trim()) return 'Enter a name';
      var sites = getSites(); sites.push({ id: 's' + Date.now().toString(36), name: v[0].trim(), type: v[1], active: true }); saveSites(sites);
      if (typeof renderSchedulePage === 'function') renderSchedulePage();
      if (document.getElementById('devicesPage') && document.getElementById('devicesPage').style.display !== 'none' && typeof renderDevicePage === 'function') renderDevicePage();
      showToast('School added');
    } });
}

/* ── Serving-line assignment (schedule meal periods) ──
   A meal period's `lines` holds serving-line ids in rotation order.
   Ids that no longer resolve (legacy names, lines removed in Settings) drop on read. */
function normLineIds(lines) {
  var known = getServingLines().map(function(sl){ return sl.id; });
  return (lines || []).filter(function(id){ return known.indexOf(id) >= 0; });
}

function getDesignOptions(){
  var opts='<option value="">— No design —</option>';
  var decks=getDeckIndex().filter(function(d){ return !d.wall; }); var boards=getBoardIndex();   /* wall decks play only on walls */
  if(decks.length){opts+='<optgroup label="District Decks">';decks.forEach(function(d){opts+='<option value="deck:'+d.id+'">&#127916; '+escHtml(d.name)+'</option>';});opts+='</optgroup>';}
  if(boards.length){opts+='<optgroup label="District Boards">';boards.forEach(function(b){opts+='<option value="board:'+b.id+'">&#9783; '+escHtml(b.name)+'</option>';});opts+='</optgroup>';}
  if(window.SHARED_BOARDS&&SHARED_BOARDS.length){SHARED_BOARDS.filter(function(b){return !(b.tier==='mgmt'&&!mgmtTierEnabled);}).forEach(function(b){var def=b.isDefault?' [default]':'';opts+='<option value="shared:'+b.id+'">'+escHtml(b.name)+def+'</option>';});}
  return opts;
}

/* ── getDynamicTextValue: resolves live text from schedule ── */
function getDynamicTextValue(field) {
  try {
    var data = getSchData();
    var meals = data.meals || getDefaultMeals();
    var playing = getCurrentlyPlaying(meals);
    if (field === 'mealPeriod') {
      var m = meals.find(function(x){ return x.id === playing; });
      return m ? m.label : 'Lunch';
    }
    if (field === 'servingLines') {
      if (activeServingLine && activeServingLine.line) return activeServingLine.line.name;
      var eff = resolveSchedule({level:'district',typeKey:null,siteId:null}, data, meals);
      var ml = eff.schedule[playing];
      var _ln = normLineIds(ml && ml.lines).map(function(id){ return getServingLines().find(function(sl){ return sl.id === id; }).name; });
      if (_ln.length) return _ln.join(' \u00b7 ');
      var _sl = activeSchoolId() ? schoolLines(activeSchoolId(), currentMealType()) : [];   /* the school's lines for the meal */
      return _sl.length ? _sl.join(' \u00b7 ') : 'All Lines';
    }
    if (field === 'date') return new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    if (field === 'school') return 'Your School';
  } catch(e) {}
  return '';
}

    + (cfg.noSize ? '' : slider(cfg.size, cfg.def, 'Size'))

    + sub('Style') + '<div class="tgl-row">'
    + tgl(fw === '700', 'setElProp(' + q(id) + ',' + q('fontWeight') + ',' + q(fw === '700' ? '' : '700') + ');buildElementControls(' + q(id) + ')', 'Bold', 'font-weight:700')

/* Alignment needs a box: an element that hugs its text (Label Bar, Badge…) first takes its current width */
function setTextAlign(id, a) {
  var el = elements.find(function(x) { return x.id === id; }); if (!el) return;
  if (!el.w) { var n = document.querySelector('#boardOuter [data-lid="' + id + '"]'); if (n) el.w = Math.round(n.getBoundingClientRect().width / (typeof canvasScale === 'number' && canvasScale ? canvasScale : 1)); }
  setElProp(id, 'textAlign', a); buildElementControls(id);

/* Replace an element's assorted size / weight / style / colour controls with the standard section */
function applyStandardTextControls(panel, el) {
  var cfg = STD_TEXT[el.type]; if (!cfg || !panel) return;
  var old = cfg.noColor ? /^(Font Size|Size)(:|$)|^Font Weight$|^Style$/ : /^(Font Size|Size)(:|$)|^Font Weight$|^Style$|^(Text )?Colou?r$/;
  var anchor = null;
  Array.prototype.slice.call(panel.querySelectorAll('.ctrl-sec')).forEach(function(s) {
    if (s.parentNode !== panel && !panel.contains(s)) return;
    var l = s.querySelector('.ctrl-label'), txt = l ? l.textContent.trim() : '';
    if (old.test(txt)) { if (!anchor) anchor = s.previousElementSibling; s.parentNode.removeChild(s); }
  });
  var wrap = document.createElement('div'); wrap.innerHTML = standardTextControls(el);
  var node = wrap.firstElementChild, secs = panel.querySelectorAll('.ctrl-sec');
  if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(node, anchor.nextSibling);
  else if (secs.length > 1) secs[1].parentNode.insertBefore(node, secs[1].nextSibling);
  else panel.appendChild(node);
}

      html += '<div class="pk-card" onclick="pickLibraryAsset(\''+it.id+'\',\'image\')">'

        +'<div class="pk-card-label">'+escHtml(it.name)+'</div></div>';
    } else {
      html += '<div class="pk-card" onclick="pickLibraryAsset(\''+it.id+'\',\'video\')">'
        +'<div style="width:100%;height:100%;background:#0a0a14;display:flex;align-items:center;justify-content:center;font-size:28px">&#127902;</div>'
        +'<div class="pk-card-label">'+escHtml(it.name)+'</div></div>';

function pickStockImage(url, label) {
  if(_pickerElId==='__theme_header__'&&window._themeHeaderCallback){window._themeHeaderCallback(url);window._themeHeaderCallback=null;closeClPicker();return;}
  if(_pickerElId==='__add_bg__'&&window._bgCallback){window._bgCallback(url);window._bgCallback=null;closeClPicker();return;}
  var el = elements.find(function(x){ return x.id===_pickerElId; });
  if(el) {
    if(el.type==='img-upload'){el.src=url;}else if(el.type==='background'){el.imgUrl=url;}else{el.imgUrl=url;el.imgLabel=label;}
    renderBoard(); buildElementControls(_pickerElId);
  }
  closeClPicker();
  showToast('Image applied');
}

function pickLibraryAsset(assetId, type) {
  var cl = getContentLibrary();
  var pools = type==='image'
    ? [cl.myImages, cl.districtImages, cl.cybersoftImages]
    : [cl.myVideos, cl.districtVideos, cl.cybersoftVideos];
  var asset = null;
  pools.forEach(function(p){ if(!asset) asset=p.find(function(x){return x.id===assetId;}); });
  if(!asset) return;

  /* Check special callbacks first */
  if(_pickerElId==='__theme_header__'&&window._themeHeaderCallback){window._themeHeaderCallback(asset.url);window._themeHeaderCallback=null;closeClPicker();return;}
  if(_pickerElId==='__add_bg__'&&window._bgCallback){window._bgCallback(asset.url);window._bgCallback=null;closeClPicker();return;}
  if(_pickerElId==='__menu_item__'&&window._itemPhotoCallback){window._itemPhotoCallback(asset.url);window._itemPhotoCallback=null;closeClPicker();return;}
  var el = elements.find(function(x){ return x.id===_pickerElId; });
  if(!el) { closeClPicker(); return; }

  if(type==='image') {
    if(el.type==='img-upload'){el.src=asset.url;}else if(el.type==='background'){el.imgUrl=asset.url;}else{el.imgUrl=asset.url;el.imgLabel=asset.name;}
    renderBoard(); buildElementControls(_pickerElId);
    showToast(asset.name+' applied ✓');
  } else {
    el.videoUrl = asset.url;
    el.embedUrl = asset.embedUrl||asset.url;
    el.platform = asset.platform||'direct';
    renderBoard(); buildElementControls(_pickerElId);
    showToast(asset.name+' applied ✓');
  }
  closeClPicker();
}

var CL_KEY = 'sctv_content_library';

/* The built-in photo library (library/, PHOTO_LIBRARY) as Content Library items: the Cybersoft level, read-only */
function libraryContentItems() {
  if (typeof PHOTO_LIBRARY === 'undefined') return [];
  return PHOTO_LIBRARY.map(function(p) {
    return { id: 'lib-' + p.id, name: p.name, filename: p.id + '.jpg', url: 'lib:' + p.id, w: p.w, h: p.h, size: Math.max(0.1, Math.round(p.bytes / 1e5) / 10),
             type: 'image', by: p.credit || 'SCTV+ photo library', date: '', tags: p.tags || [], builtin: true };
  });
}
function getContentLibrary() {
  var cl = null, def = buildDefaultCL();
  try { cl = JSON.parse(localStorage.getItem(CL_KEY) || 'null'); } catch(e) {}
  if (!cl) cl = def;
  if (!cl.mgmtImages) cl.mgmtImages = def.mgmtImages;
  if (!cl.mgmtVideos) cl.mgmtVideos = def.mgmtVideos;
  cl.cybersoftImages = libraryContentItems();   /* always the photo library itself (read-only) */
  return cl;
}
function saveContentLibrary(data) {
  var copy = Object.assign({}, data); delete copy.cybersoftImages;   /* the built-in library isn't stored: it comes from PHOTO_LIBRARY */
  try { localStorage.setItem(CL_KEY, JSON.stringify(copy)); } catch(e) {}
}

function renderClContent(){
  var cl=getContentLibrary();
  var items=clTier==='menuphotos'?(clType==='images'?menuItemPhotos():[]):clTier==='my'?(clType==='images'?cl.myImages:cl.myVideos):clTier==='mgmt'?(clType==='images'?(cl.mgmtImages||[]):(cl.mgmtVideos||[])):clTier==='district'?(clType==='images'?cl.districtImages:cl.districtVideos):(clType==='images'?cl.cybersoftImages:cl.cybersoftVideos);
  var ia=clTier==='menuphotos'?menuItemPhotos():clTier==='my'?cl.myImages:clTier==='district'?cl.districtImages:cl.cybersoftImages;
  var va=clTier==='menuphotos'?[]:clTier==='my'?cl.myVideos:clTier==='district'?cl.districtVideos:cl.cybersoftVideos;
  var ic=document.getElementById('clImgCount');if(ic)ic.textContent='('+ia.length+')';
  var vc=document.getElementById('clVidCount');if(vc)vc.textContent='('+va.length+')';
  var mb=document.getElementById('clMipBadge');if(mb&&typeof menuItemPhotos==='function')mb.textContent=menuItemPhotos().length;   /* Menu item photos count */
  var q=(document.getElementById('clSearchInp')&&document.getElementById('clSearchInp').value||'').toLowerCase();
  if(q)items=items.filter(function(it){return it.name.toLowerCase().includes(q)||(it.tags||[]).some(function(t){return t.includes(q);});});
  if(clActiveTag)items=items.filter(function(it){return(it.tags||[]).includes(clActiveTag);});
  var sort=(document.getElementById('clSortSel')&&document.getElementById('clSortSel').value)||'date-desc';
  if(sort==='name')items=items.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  else if(sort==='date-asc')items=items.slice().reverse();
  var allItems=clType==='images'?ia:va;
  var allTags={};allItems.forEach(function(it){(it.tags||[]).forEach(function(t){allTags[t]=(allTags[t]||0)+1;});});
  var tb=document.getElementById('clTagBar');
  if(tb)tb.innerHTML=Object.keys(allTags).sort().map(function(t){return '<button class="cl-tag-chip'+(clActiveTag===t?' active':'')+'" onclick="clActiveTag='+JSON.stringify(clActiveTag===t?null:t)+';renderClContent()">'+t+'</button>';}).join('');
  var body=document.getElementById('clBody');if(!body)return;
  if(!items.length){body.innerHTML='<div class="cl-empty">'+(clType==='images'?'&#128247;':'&#127902;')+'<br>No '+clType+' here'+(clTier==='my'?'<br><button class="cl-hdr-btn primary" style="margin-top:12px" onclick="openClUpload()">Upload</button>':'')+'</div>';return;}

    var thumb=it.type==='image'?'<div class="cl-thumb"><img src="'+it.url+'" referrerpolicy="no-referrer" crossorigin="anonymous" loading="lazy" style="width:100%;height:100%;object-fit:cover"><div class="cl-card-hover"><button onclick="event.stopPropagation();openClPreview(\''+it.id+'\')" title="Preview">&#128065;</button></div></div>':'<div class="cl-thumb"><div class="cl-thumb-video">&#127902;</div><div class="cl-card-hover"><button onclick="event.stopPropagation();openClPreview(\''+it.id+'\')" title="Preview">&#128065;</button></div></div>';
    var tags=(it.tags||[]).slice(0,3).map(function(t){return '<span class="cl-tag">'+t+'</span>';}).join('');
    return '<div class="cl-card" onclick="openClPreview(\''+it.id+'\')">'+thumb+'<div class="cl-card-info"><div class="cl-card-name">'+escHtml(it.name)+'</div><div class="cl-card-meta"><span>'+escHtml(it.by)+'</span><span>'+it.date+'</span></div><div style="margin-top:4px">'+tags+'</div></div></div>';
  }).join('')+'</div>';
}

function closeClPreview() {

function refreshPreviewTags(id, tier) {
  var cl = getContentLibrary();
  var pools = tier==='my'?[cl.myImages,cl.myVideos]:tier==='district'?[cl.districtImages,cl.districtVideos]:[cl.cybersoftImages,cl.cybersoftVideos];
  var found = null;
  pools.forEach(function(p){if(!found)found=p.find(function(x){return x.id===id;});});
  if(!found) return;
  var canEdit = tier==='my' || (isAdminMode() && tier!=='my');
  var container = document.getElementById('clPreviewTags');
  if(!container) return;
  container.innerHTML = (found.tags||[]).map(function(t){
    return '<span class="cl-tag" style="font-size:11px;padding:2px 8px;cursor:'+(canEdit?'pointer':'default')+'"'
      +(canEdit?' onclick="removeClTag(\''+id+'\',\''+t+'\',\''+tier+'\')"':'')+'>'
      +t+(canEdit?' &#215;':'')+'</span>';
  }).join('') || '<span style="font-size:12px;color:var(--muted)">No tags</span>';
}

function addClTag(id, tier) {
  var input = document.getElementById('clTagInput');
  if(!input) return;
  var tag = input.value.trim().toLowerCase().replace(/[^a-z0-9-\s]/g,'').replace(/\s+/g,'-');
  if(!tag) return;
  var cl = getContentLibrary();
  var pools = tier==='my'?[cl.myImages,cl.myVideos]:tier==='district'?[cl.districtImages,cl.districtVideos]:[cl.cybersoftImages,cl.cybersoftVideos];
  var found = null;
  pools.forEach(function(p){if(!found)found=p.find(function(x){return x.id===id;});});
  if(!found) return;
  if(!found.tags) found.tags = [];
  if(!found.tags.includes(tag)) found.tags.push(tag);
  saveContentLibrary(cl);
  input.value = '';
  refreshPreviewTags(id, tier);
  renderClContent();
}

function removeClTag(id, tag, tier) {
  var cl = getContentLibrary();
  var pools = tier==='my'?[cl.myImages,cl.myVideos]:tier==='district'?[cl.districtImages,cl.districtVideos]:[cl.cybersoftImages,cl.cybersoftVideos];
  var found = null;
  pools.forEach(function(p){if(!found)found=p.find(function(x){return x.id===id;});});
  if(!found) return;
  found.tags = (found.tags||[]).filter(function(t){return t!==tag;});
  saveContentLibrary(cl);
  refreshPreviewTags(id, tier);
  renderClContent();
}

function deleteClItem(id, tier, type) {
  if (String(id).indexOf('lib-') === 0) { showToast('Built-in library photos can\u2019t be deleted'); return; }
  var cl = getContentLibrary();
  var listKey = tier==='my'?(type==='image'?'myImages':'myVideos'):tier==='district'?(type==='image'?'districtImages':'districtVideos'):(type==='image'?'cybersoftImages':'cybersoftVideos');
  var pos = cl[listKey].findIndex(function(x){return x.id===id;}), removed = cl[listKey][pos];   /* for Undo */
  cl[listKey] = cl[listKey].filter(function(x){return x.id!==id;});
  saveContentLibrary(cl);
  closeClPreview();
  renderClBadges(cl);
  renderClStorage(cl);
  renderClContent();
  showUndoToast('Item deleted', function() {
    var c2 = getContentLibrary(); if (removed) c2[listKey].splice(Math.max(0, pos), 0, removed); saveContentLibrary(c2);
    renderClBadges(c2); renderClStorage(c2); renderClContent();
  });
}

function suggestTagsFromFilename(filename) {
  var name = filename.replace(/\.[^.]+$/, '').toLowerCase().replace(/[-_]/g, ' ');
  var words = name.split(/\s+/).filter(function(w){ return w.length > 2 && !/^\d+$/.test(w); });
  var suggestions = [];

  var foodTerms = ['pizza','salad','fruit','chicken','pasta','soup','burger','sandwich',
    'taco','burrito','breakfast','lunch','dinner','snack','dessert','cookie','brownie',
    'eggs','pancake','oatmeal','rice','stir','fry','noodle','ramen','vegetable','veggie'];
  var catTerms  = ['background','bg','logo','brand','hero','banner','menu','photo',
    'icon','seasonal','event','welcome','promo','nutrition','wellness','usda','farm',
    'school','district','portrait','landscape','wide','close','feature','header'];

  words.forEach(function(w){
    foodTerms.forEach(function(f){ if(w.includes(f) && !suggestions.includes(f)) suggestions.push(f); });
    catTerms.forEach(function(c){ if(w.includes(c) && !suggestions.includes(c)) suggestions.push(c.replace('bg','background')); });
  });

  /* fallback: use significant words from filename as-is */
  if(!suggestions.length) {
    words.slice(0,3).forEach(function(w){
      if(w.length>3) suggestions.push(w);
    });
  }
  return suggestions.slice(0,4);
}

function clQueueSetName(idx, val) {
  if(_uploadQueue[idx]) _uploadQueue[idx].name = val;
}

function clQueueToggleTag(idx, el, tag) {
  if(!_uploadQueue[idx]) return;
  var tags = _uploadQueue[idx].tags;
  var active = el.classList.contains('active');
  if(active) {
    _uploadQueue[idx].tags = tags.filter(function(t){ return t !== tag; });
    el.classList.remove('active');
    el.innerHTML = tag + ' +';
  } else {
    _uploadQueue[idx].tags.push(tag);
    el.classList.add('active');
    el.innerHTML = tag + ' &#10003;';
  }
}

function clQueueAddTag(idx, input) {
  var tag = input.value.trim().toLowerCase().replace(/[^a-z0-9-\s]/g,'').replace(/\s+/g,'-');
  if(!tag || !_uploadQueue[idx]) return;
  if(_uploadQueue[idx].tags.includes(tag)) { input.value=''; return; }
  _uploadQueue[idx].tags.push(tag);
  input.value = '';
  /* append to tag row */
  var row = document.getElementById('clStageTags_'+idx);
  if(row) {
    var span = document.createElement('span');
    span.className = 'cl-stage-tag active';
    span.textContent = tag + ' ✓';
    span.onclick = function(){ clQueueToggleTag(idx, span, tag); };
    row.appendChild(span);
  }
}

function confirmClUpload() {
  var items = _uploadQueue.filter(function(i) { return i._blob; });
  if (!items.length) { showToast('Nothing ready to add yet'); return; }
  Promise.all(items.map(function(item) { return storePhoto(item._blob).then(function(s) {
    return { id: item.id, name: item.name, filename: item.filename, url: s.url, assetId: s.assetId, w: item.w, h: item.h, size: item.size,
             type: 'image', by: item.by, date: item.date, tags: item.tags };
  }); })).then(function(clean) {
    var cl = getContentLibrary();
    clean.reverse().forEach(function(c) { cl.myImages.unshift(c); });
    saveContentLibrary(cl);
    _uploadQueue = [];
    closeClUpload();
    renderClPage();
    showToast('Added to library \u2713');
  }).catch(function(e) { showToast('Couldn\u2019t add: ' + ((e && (e.message || e.code)) || 'error')); });
}

function resetClUpload() {
  _uploadQueue = [];

var _themePickerCb = null;

function setThemePickerTab(tab) {

    var el = document.getElementById('tpt-'+t);
    if(el) el.classList.toggle('active', t === tab);

  var tabs = document.getElementById('themePickerTabs');
  if(tabs) {

    if(mgmtTab) mgmtTab.style.display = mgmtTierEnabled ? 'block' : 'none';
  }

function renderThemeCards() {
  var area = document.getElementById('themePickerCards');
  if(!area) return;
  var themes = getThemes();
  var filtered = themes.filter(function(t){ return t.tier === _themePickerTab; });

  if(!filtered.length) {
    area.innerHTML = '<div class="pk-empty">No themes in this tier yet.</div>';
    return;
  }

/* Rename a library item (from its details): the name and the file name (same extension). Boards refer to photos by id,
   so renaming never breaks them. Built-in library photos are read-only. */
function renameClItem(id, tier, name) {
  name = String(name || '').trim();
  if (!name) { showToast('Enter a name'); openClPreview(id, tier); return; }
  var cl = getContentLibrary();
  var pools = tier === 'my' ? [cl.myImages, cl.myVideos] : tier === 'district' ? [cl.districtImages, cl.districtVideos] : [cl.cybersoftImages, cl.cybersoftVideos];
  var item = null; pools.forEach(function(p) { (p || []).forEach(function(x) { if (x.id === id) item = x; }); });
  if (!item || String(id).indexOf('lib-') === 0) return;
  var old = item.name; if (old === name) return;
  item.name = name;
  if (item.filename) { var ext = (item.filename.match(/\.[A-Za-z0-9]+$/) || [''])[0]; item.filename = name.replace(/[\\/:*?"<>|]+/g, '-') + ext; }
  saveContentLibrary(cl); renderClContent();
  showToast('Renamed to \u201c' + name + '\u201d');
}

function toggleBlockDistrict(dId) {
  loadBlockedSources();
  var idx = blockedSources.indexOf(dId);
  if(idx >= 0) {
    blockedSources.splice(idx, 1);
    (SHARED_BOARDS||[]).forEach(function(b){ if(b.sourceDistrict===dId && b.status==='blocked') b.status='pending'; });
    (SHARED_DECKS||[]).forEach(function(dk){ if(dk.sourceDistrict===dId && dk.status==='blocked') dk.status='pending'; });
  } else {
    blockedSources.push(dId);
    (SHARED_BOARDS||[]).forEach(function(b){ if(b.sourceDistrict===dId && b.status==='pending') b.status='blocked'; });
    (SHARED_DECKS||[]).forEach(function(dk){ if(dk.sourceDistrict===dId && dk.status==='pending') dk.status='blocked'; });
  }
  saveBlockedSources();
  renderSettingsPage();
  buildSharedGrid();
  if(typeof buildSharedDecksGrid === 'function') buildSharedDecksGrid();
  var dist = DISTRICT_DATA[dId];
  showToast((idx>=0?'Unblocked ':'Blocked ')+(dist?dist.name:dId));
}

function refreshNav(activePage) {

  var pageNavMap = {

    schedule:'schedulePage', devices:'devicesPage', content:'contentLibraryPage',
    settings:'settingsPage', menulists:'menuListsPage', menucalendar:'menuCalendarPage', menuitems:'menuItemsPage',
    import:'importPage', users:'usersPage',
    whatsnew:'whatsNewPage',
    admin:'adminPage',
    publishing:'publishingPage'
  };
  /* Rebuild ALL page navs to keep them in sync */
  document.querySelectorAll('.lnd-nav').forEach(function(nav) {
    var page = nav.closest('[id]');

    var pid = page.id;
